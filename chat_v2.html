<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0b0f">
<title>P2P WebRTC Chat & File Transfer</title>
<style>
  :root {
    --bg: #0a0b0f;
    --panel: #16181f;
    --panel-2: #1b1e26;
    --panel-3: #20232c;
    --border: #282b35;
    --border-strong: #383c49;
    --text: #eef0f4;
    --text-dim: #939aab;
    --text-faint: #666c7d;
    --accent: #4f8cff;
    --accent-hover: #3d78ec;
    --accent-soft: rgba(79, 140, 255, 0.14);
    --green: #2fd980;
    --green-soft: rgba(47, 217, 128, 0.14);
    --amber: #f4b942;
    --amber-soft: rgba(244, 185, 66, 0.14);
    --red: #f0495e;
    --red-soft: rgba(240, 73, 94, 0.14);
    --teal: #22c1b6;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 9px;
    --shadow-card: 0 10px 30px -8px rgba(0, 0, 0, 0.55);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html { -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font);
    max-width: 640px;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: var(--bg);
    background-image:
      radial-gradient(700px 320px at 15% -5%, rgba(79, 140, 255, 0.09), transparent 60%),
      radial-gradient(600px 300px at 100% 0%, rgba(34, 193, 182, 0.07), transparent 55%);
    background-attachment: fixed;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }

  ::selection { background: var(--accent-soft); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  .app-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 6px 2px 18px;
  }
  .app-header .logo {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 11px;
    background: linear-gradient(145deg, var(--accent), var(--teal));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    box-shadow: 0 6px 16px -4px rgba(79, 140, 255, 0.45);
  }
  .app-header h2 {
    margin: 0;
    font-size: 1.15em;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .app-header .subtitle {
    margin: 2px 0 0;
    font-size: 0.8em;
    color: var(--text-dim);
  }

  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel) 60%, var(--panel-2));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
  }

  .controls {
    margin-bottom: 16px;
    padding: 20px;
  }

  .field-label {
    font-weight: 600;
    font-size: 0.78em;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--text-dim);
    display: block;
    margin-bottom: 8px;
  }

  input[type="text"] {
    padding: 12px 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-family: var(--font);
    background: var(--panel-2);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    width: 100%;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: var(--panel-3);
  }
  input[type="text"]:disabled { opacity: 0.55; cursor: not-allowed; }
  input[type="text"]::placeholder { color: var(--text-faint); }

  #roomName { margin-bottom: 16px; }

  button {
    padding: 11px 18px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    font-family: var(--font);
    transition: background 0.15s, filter 0.15s, transform 0.05s, opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  #actionButtons { display: flex; gap: 10px; }
  #actionButtons button { flex: 1; padding: 13px 16px; }

  #hostBtn { background: var(--panel-3); border: 1px solid var(--border-strong); color: var(--text); }
  #hostBtn:hover { background: var(--panel-2); border-color: var(--text-faint); }

  #joinBtn { background: var(--green); color: #052b17; }
  #joinBtn:hover { filter: brightness(1.08); }

  .share-box {
    margin-top: 16px;
    padding: 14px;
    background: var(--accent-soft);
    border: 1px solid rgba(79, 140, 255, 0.35);
    border-radius: var(--radius-md);
  }
  .share-box label { color: #a9c6ff; }
  .share-row { display: flex; gap: 8px; }
  .share-row input[type="text"] { flex: 1; font-size: 13.5px; min-width: 0; }
  .share-row button {
    background: var(--teal);
    color: #04241f;
    padding: 0 14px;
    font-size: 13.5px;
    flex-shrink: 0;
  }
  .share-row button:hover { filter: brightness(1.08); }

  .status-text {
    text-align: left;
    margin: 16px 0 0;
    padding: 0;
  }

  #chatUI {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: background 0.25s, border-color 0.25s;
  }

  #chatUI.dragover {
    background: linear-gradient(180deg, rgba(79, 140, 255, 0.08), var(--panel-2));
    border: 2px dashed var(--accent);
  }

  .roomBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 0.85em;
    color: var(--text-dim);
  }
  #roomLabel {
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .roomBar button {
    font-size: 12.5px;
    padding: 7px 12px;
    background: var(--panel-3);
    color: var(--teal);
    border: 1px solid var(--border-strong);
    flex-shrink: 0;
  }
  .roomBar button:hover { background: var(--panel-2); border-color: var(--teal); }

  #connBadges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75em;
    font-weight: 600;
    padding: 5px 10px 5px 8px;
    border-radius: 20px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
    box-shadow: 0 0 0 0 transparent;
  }
  .badge.state-live, .badge.state-connected { background: var(--green-soft); border-color: rgba(47, 217, 128, 0.3); color: #a6f0c6; }
  .badge.state-live .dot, .badge.state-connected .dot { background: var(--green); box-shadow: 0 0 8px 0 rgba(47, 217, 128, 0.7); }
  .badge.state-connecting { background: var(--amber-soft); border-color: rgba(244, 185, 66, 0.3); color: #f6d493; }
  .badge.state-connecting .dot { background: var(--amber); animation: pulse 1.3s ease-in-out infinite; }
  .badge.state-offline, .badge.state-failed { background: var(--red-soft); border-color: rgba(240, 73, 94, 0.3); color: #f6aab2; }
  .badge.state-offline .dot, .badge.state-failed .dot { background: var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.85); }
  }

  #mediaControls { display: flex; gap: 8px; flex-wrap: wrap; }
  #mediaControls button {
    font-size: 13.5px;
    padding: 8px 14px;
    background: var(--panel-3);
    border: 1px solid var(--border-strong);
    color: var(--text);
  }
  #mediaControls button:hover { background: var(--panel-2); border-color: var(--text-faint); }
  #mediaControls button.active { background: var(--green-soft); color: #a6f0c6; border-color: rgba(47, 217, 128, 0.45); }

  #videoRow {
    gap: 10px;
    margin: 0;
  }
  #videoRow video {
    flex: 1;
    min-width: 0;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: var(--radius-md);
    background: #000;
    border: 1px solid var(--border);
  }

  .dropHint {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.78em;
    margin: 0;
    padding: 8px 10px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-sm);
  }

  #chatBox {
    border: 1px solid var(--border);
    height: 350px;
    overflow-y: auto;
    padding: 14px;
    background: var(--panel-2);
    border-radius: var(--radius-md);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .msg {
    margin: 4px 0;
    padding: 10px 14px;
    border-radius: 18px;
    width: fit-content;
    max-width: 82%;
    word-wrap: break-word;
    font-size: 14.5px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  }
  .msg.me {
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .msg.them {
    background: var(--panel-3);
    border: 1px solid var(--border);
    color: var(--text);
    margin-right: auto;
    border-bottom-left-radius: 4px;
  }
  .msg.sys {
    background: transparent;
    box-shadow: none;
    text-align: center;
    color: var(--text-faint);
    font-size: 0.85em;
    margin: 8px auto;
    max-width: 95%;
  }
  .via-relay {
    opacity: 0.8;
    font-size: 0.8em;
    font-weight: normal;
  }

  .transfer { min-width: 220px; }
  .transfer-label { font-size: 0.85em; font-weight: 600; margin-bottom: 7px; }
  .transfer-bar-track {
    height: 7px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 4px;
    overflow: hidden;
  }
  .msg.them .transfer-bar-track { background: rgba(255, 255, 255, 0.08); }
  .msg.me .transfer-bar-track { background: rgba(255, 255, 255, 0.3); }
  .transfer-bar-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 0.15s ease-out;
  }
  .transfer-meta {
    font-size: 0.78em;
    opacity: 0.9;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .transfer-meta button {
    font-size: 0.75em;
    padding: 3px 10px;
    background: var(--red);
    flex-shrink: 0;
  }
  .transfer-meta button:hover { filter: brightness(1.1); }

  .msg .download-btn {
    margin-top: 8px;
    padding: 7px 13px;
    font-size: 13px;
    background: var(--green);
    color: #052b17;
  }
  .msg .download-btn:hover { filter: brightness(1.08); }
  .saving-note { color: var(--amber); }

  a { color: #8fb8f5; }
  .hidden { display: none !important; }

  .chat-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .icon-btn {
    padding: 0;
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 50%;
    background: var(--panel-3);
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--panel-2); border-color: var(--text-faint); }

  .chat-input-row input[type="text"] {
    flex: 1;
    min-width: 0;
    border-radius: 22px;
    padding: 12px 16px;
  }

  .send-btn {
    border-radius: 22px;
    padding: 0 22px;
    height: 44px;
    flex-shrink: 0;
  }

  /* Mobile responsiveness adjustments */
  @media (max-width: 480px) {
    body { padding-left: 10px; padding-right: 10px; }
    .controls, #chatUI { padding: 14px; }
    #chatBox { height: min(50vh, 420px); padding: 10px; }
    .msg { max-width: 88%; font-size: 14px; }
    #videoRow { flex-direction: column; }
    #videoRow video { aspect-ratio: 16 / 10; }
    .app-header .logo { width: 34px; height: 34px; font-size: 16px; border-radius: 9px; }
    .app-header h2 { font-size: 1.02em; }
    button { font-size: 14.5px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="logo">🔒</div>
  <div>
    <h2>Secure P2P Chat</h2>
    <p class="subtitle">Direct WebRTC connection · nothing stored on a server</p>
  </div>
</div>

<div class="controls card" id="setupUI">
  <label class="field-label">Room Name / ID</label>
  <input type="text" id="roomName" placeholder="super-secret-chat-992">

  <div id="actionButtons">
    <button id="hostBtn" onclick="hostChat()">1. Host Chat</button>
    <button id="joinBtn" onclick="joinChat()">2. Join Chat</button>
  </div>

  <div id="shareContainer" class="share-box hidden">
    <label style="font-size: 0.9em; font-weight: bold; display: block; margin-bottom: 8px;">Share this link with your friend:</label>
    <div class="share-row">
      <input type="text" id="shareUrl" readonly>
      <button onclick="copyShareUrl()">Copy Link</button>
    </div>
  </div>

  <p id="status" class="sys status-text">Status: Waiting for input...</p>
</div>

<div id="chatUI" class="card hidden">
  <div class="roomBar">
    <span id="roomLabel"></span>
    <button id="copyLinkBtn" class="hidden" onclick="copyShareUrl()">Copy Invite Link</button>
  </div>

  <div id="connBadges">
    <span id="wsBadge" class="badge state-offline"><span class="dot"></span><span class="label">Signaling: offline</span></span>
    <span id="p2pBadge" class="badge state-offline"><span class="dot"></span><span class="label">P2P: not connected</span></span>
    <span id="peerBadge" class="badge state-offline"><span class="dot"></span><span class="label">Peer: not connected</span></span>
  </div>

  <div id="mediaControls">
    <button id="voiceToggleBtn" onclick="toggleVoice()">Start Voice Call</button>
    <button id="videoToggleBtn" onclick="toggleVideo()">Start Video</button>
  </div>

  <div id="videoRow" class="hidden" style="display: flex;">
    <video id="localVideo" class="hidden" autoplay muted playsinline></video>
    <video id="remoteVideo" class="hidden" autoplay playsinline></video>
  </div>

  <p class="dropHint">📎 Drag and drop files here, or use the attach button (needs a direct P2P connection)</p>

  <div id="chatBox"></div>
  <div class="chat-input-row">
    <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
    <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach File">📎</button>
    <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMsg()">
    <button class="send-btn" onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  let pc = null;
  let dataChannel = null;
  let roomName = "";        // human-entered room name
  let room = "";              // namespaced room id used on the wire
  let role = null;            // "host" | "join"
  let signalingUrl = null;

  let ws = null;
  let wsShouldRun = false;    // true once the user has started hosting/joining
  let reconnectAttempts = 0;
  let reconnectTimer = null;

  let hostSessionId = null;   // set by the host, echoed back by the answer
  let appliedSess = null;     // last session id the joiner has answered

  let localSdp = null;        // our current offer (host) or answer (join)
  let sdpKind = null;         // "offer" | "answer"
  let inProgress = false;     // a (re)negotiation attempt is under way
  let everConnected = false;  // has the data channel ever opened this session
  let buildTimeoutTimer = null;
  let watchdogTimer = null;

  let announceTimer = null;
  let pendingAnnounce = null; // fn re-sent on a timer until cleared

  let pendingFile = null;       // File object queued/in-flight for upload
  let uploadTransferId = null;  // ties an offer to its accept/chunks/done/cancel
  let uploadAbort = false;      // cooperative stop flag for the upload loop

  let incomingFileInfo = null;    // {type,name,size,transferId} for the active download
  let incomingFileData = [];      // in-memory fallback buffer (no File System Access API)
  let incomingWriter = null;      // streaming disk writer, when the browser supports it
  let incomingReceived = 0;
  let incomingStartTime = 0;
  let downloadAbort = false;

  const FILE_CHUNK_SIZE = 16384;
  const BUFFER_HIGH_WATERMARK = 1024 * 1024;
  const BUFFER_LOW_WATERMARK = 256 * 1024;

  const genTransferId = () => Math.random().toString(36).slice(2);

  let audioTransceiver, videoTransceiver;
  let localStream = null;
  let callMode = "off";       // "off" | "audio" | "video" -- our own outgoing call state
  let callStarting = false;
  let remoteCallMode = "off"; // "off" | "audio" | "video" -- peer's reported call state

  const HEARTBEAT_INTERVAL_MS = 1000;
  const HEARTBEAT_TIMEOUT_MS = 3000;
  let heartbeatTimer = null;
  let lastPeerHeartbeat = 0;   // Date.now() of the last beat we received
  let lastHeartbeatVia = null; // "p2p" | "relay"

  const APP_NS = "qk7x2v9p";
  const namespacedRoom = (name) => `${APP_NS}:${name}`;

  const iceServers = {
    iceServers: [
      { urls: [
          "stun:stun.l.google.com:19302",
          "stun:stun1.l.google.com:19302",
          "stun:stun2.l.google.com:19302"
        ] },
      { urls: "stun:stun.cloudflare.com:3478" }
    ]
  };

  // ---------------------------------------------------------------------
  // Small UI helpers
  // ---------------------------------------------------------------------
  const updateStatus = (text) => {
    document.getElementById("status").textContent = "Status: " + text;
  };

  const addMsg = (text, type) => {
    const box = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerHTML = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  };

  function formatBytes(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }

  function formatDuration(seconds) {
    seconds = Math.max(0, Math.round(seconds));
    if (seconds < 60) return `${seconds}s`;
    const m = Math.floor(seconds / 60), s = seconds % 60;
    if (m < 60) return `${m}m ${s}s`;
    const h = Math.floor(m / 60), rm = m % 60;
    return `${h}h ${rm}m`;
  }

  const setBadge = (id, state, label) => {
    const el = document.getElementById(id);
    el.className = "badge state-" + state;
    el.querySelector(".label").textContent = label;
  };

  const updateWsBadge = (state) => {
    const labels = {
      offline: "Signaling: offline",
      connecting: "Signaling: connecting...",
      live: "Signaling: live",
      reconnecting: "Signaling: reconnecting..."
    };
    setBadge("wsBadge", state, labels[state] || state);
  };

  const updateP2pBadge = (state) => {
    const labels = {
      offline: "P2P: not connected",
      connecting: "P2P: connecting...",
      connected: "P2P: connected (direct)",
      failed: "P2P: unavailable (using relay)"
    };
    setBadge("p2pBadge", state, labels[state] || state);
  };

  const updatePeerBadge = () => {
    if (!lastPeerHeartbeat) {
      setBadge("peerBadge", "connecting", "Peer: waiting...");
      return;
    }
    const age = Date.now() - lastPeerHeartbeat;
    if (age > HEARTBEAT_TIMEOUT_MS) {
      setBadge("peerBadge", "offline", "Peer: offline");
    } else {
      setBadge("peerBadge", "live", `Peer: online (${lastHeartbeatVia === "p2p" ? "P2P" : "relay"})`);
    }
  };

  const updateCallButtons = () => {
    const voiceBtn = document.getElementById("voiceToggleBtn");
    const videoBtn = document.getElementById("videoToggleBtn");
    if (callMode === "video") {
      voiceBtn.textContent = "Switch to Voice Only";
      videoBtn.textContent = "Stop Video";
    } else if (callMode === "audio") {
      voiceBtn.textContent = "End Voice Call";
      videoBtn.textContent = "Switch to Video";
    } else {
      voiceBtn.textContent = "Start Voice Call";
      videoBtn.textContent = "Start Video";
    }
    voiceBtn.classList.toggle("active", callMode === "audio");
    videoBtn.classList.toggle("active", callMode === "video");
  };

  function setAnnounce(fn) {
    pendingAnnounce = fn;
    clearInterval(announceTimer);
    announceTimer = null;
    if (fn) {
      fn();
      announceTimer = setInterval(() => { if (pendingAnnounce) pendingAnnounce(); }, 1500);
    }
  }

  const getSignalingUrl = () => {
    const params = new URLSearchParams(window.location.search);
    let sig = params.get("signaling");
    if (!sig) return null;
    sig = sig.trim();
    if (!/^wss?:\/\//i.test(sig)) sig = "wss://" + sig;
    return sig;
  };

  const sendSignal = (payload) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return false;
    ws.send(JSON.stringify({ room, ...payload }));
    return true;
  };

  function handleSignalMessage(event) {
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch (e) {
      return;
    }
    if (!msg || msg.room !== room) return;

    if (msg.kind === "chat") {
      addMsg(msg.text, "them");
    } else if (msg.kind === "hello" && role === "host") {
      handleHello();
    } else if (msg.kind === "offer" && role === "join") {
      handleIncomingOffer(msg);
    } else if (msg.kind === "answer" && role === "host") {
      handleIncomingAnswer(msg);
    } else if (msg.kind === "heartbeat") {
      recordHeartbeat("relay");
      if (typeof msg.mode === "string") handleRemoteCallState(msg.mode);
    }
  }

  function recordHeartbeat(via) {
    lastPeerHeartbeat = Date.now();
    lastHeartbeatVia = via;
    updatePeerBadge();
  }

  function sendHeartbeat() {
    const payload = { type: "heartbeat", mode: callMode };
    if (dataChannel && dataChannel.readyState === "open") {
      dataChannel.send(JSON.stringify(payload));
    } else if (ws && ws.readyState === WebSocket.OPEN && room) {
      sendSignal({ kind: "heartbeat", mode: callMode });
    }
  }

  function startHeartbeatLoop() {
    stopHeartbeatLoop();
    sendHeartbeat();
    updatePeerBadge();
    heartbeatTimer = setInterval(() => {
      sendHeartbeat();
      updatePeerBadge(); // re-check staleness every tick even if nothing new arrived
    }, HEARTBEAT_INTERVAL_MS);
  }

  function stopHeartbeatLoop() {
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
  }

  function openSignalingSocket() {
    updateWsBadge(reconnectAttempts > 0 ? "reconnecting" : "connecting");
    try {
      ws = new WebSocket(signalingUrl);
    } catch (e) {
      scheduleReconnect();
      return;
    }

    ws.addEventListener("open", () => {
      reconnectAttempts = 0;
      updateWsBadge("live");
      if (pendingAnnounce) pendingAnnounce();
    });

    ws.addEventListener("message", handleSignalMessage);

    ws.addEventListener("close", () => {
      if (!wsShouldRun) return;
      scheduleReconnect();
    });
  }

  function scheduleReconnect() {
    if (!wsShouldRun) return;
    updateWsBadge("offline");
    clearTimeout(reconnectTimer);
    reconnectAttempts++;
    const delay = Math.min(1000 * 2 ** reconnectAttempts, 10000);
    reconnectTimer = setTimeout(openSignalingSocket, delay);
  }

  const connectSignaling = () => {
    return new Promise((resolve, reject) => {
      signalingUrl = getSignalingUrl();
      if (!signalingUrl) {
        reject(new Error("No signaling server set. Add ?signaling=your-ws-host to the page URL."));
        return;
      }
      wsShouldRun = true;
      reconnectAttempts = 0;

      const timeout = setTimeout(() => {
        reject(new Error("Could not reach signaling server: " + signalingUrl));
      }, 7000);

      openSignalingSocket();
      ws.addEventListener("open", () => {
        clearTimeout(timeout);
        resolve();
      }, { once: true });
    });
  };

  const setupPeerConnection = (isHost) => {
    const myPc = new RTCPeerConnection(iceServers);
    pc = myPc;

    myPc.onconnectionstatechange = () => {
      if (pc !== myPc) return;
      const state = myPc.connectionState;
      if (state === "connected") {
        updateP2pBadge("connected");
        setAnnounce(null);
        inProgress = false;
        clearTimeout(buildTimeoutTimer);
        clearTimeout(watchdogTimer);
      } else if (state === "connecting" || state === "new") {
        updateP2pBadge("connecting");
      } else if (state === "failed" || state === "closed") {
        updateP2pBadge("failed");
        clearTimeout(watchdogTimer);
        triggerReconnect(myPc);
      } else if (state === "disconnected") {
        updateP2pBadge("failed");
        clearTimeout(watchdogTimer);
        watchdogTimer = setTimeout(() => {
          if (pc === myPc && myPc.connectionState !== "connected") triggerReconnect(myPc);
        }, 4000);
      }
    };

    myPc.ontrack = (event) => {
      if (pc !== myPc) return;
      const track = event.track;
      const remoteVideo = document.getElementById("remoteVideo");
      if (!remoteVideo.srcObject) remoteVideo.srcObject = new MediaStream();
      remoteVideo.srcObject.addTrack(track);
      
      remoteVideo.srcObject = remoteVideo.srcObject;
      remoteVideo.play().catch(() => {});
    };

    if (isHost) {
      audioTransceiver = myPc.addTransceiver("audio", { direction: "sendrecv" });
      videoTransceiver = myPc.addTransceiver("video", { direction: "sendrecv" });

      const remoteVideo = document.getElementById("remoteVideo");
      if (!remoteVideo.srcObject) remoteVideo.srcObject = new MediaStream();
      remoteVideo.srcObject.addTrack(audioTransceiver.receiver.track);
      remoteVideo.srcObject.addTrack(videoTransceiver.receiver.track);
      remoteVideo.srcObject = remoteVideo.srcObject;
    }

    return myPc;
  };

  function triggerReconnect(fromPc) {
    if (fromPc !== pc) return;
    if (inProgress) return;

    if (role === "host") {
      const peerRecentlySeen = lastPeerHeartbeat && (Date.now() - lastPeerHeartbeat < HEARTBEAT_TIMEOUT_MS);
      if (peerRecentlySeen) {
        addMsg(everConnected ? "Direct P2P link lost -- reconnecting..." : "Still trying to establish a direct link...", "sys");
        establishHostConnection();
      } else {
        if (everConnected) addMsg("Direct P2P link lost, and your friend seems to have left -- waiting for them to come back...", "sys");
        enterHostWaitingState("Waiting for your friend to (re)join...");
      }
    } else {
      addMsg(everConnected ? "Direct P2P link lost -- reconnecting..." : "Still trying to establish a direct link...", "sys");
      establishJoinConnection();
    }
  }

  function updateVideoRowVisibility() {
    const row = document.getElementById("videoRow");
    const lv = document.getElementById("localVideo");
    const rv = document.getElementById("remoteVideo");
    const anyVisible = !lv.classList.contains("hidden") || !rv.classList.contains("hidden");
    row.classList.toggle("hidden", !anyVisible);
  }

  function handleRemoteCallState(mode) {
    if (mode === remoteCallMode) return;
    remoteCallMode = mode;
    const remoteVideo = document.getElementById("remoteVideo");
    if (mode === "video") {
      remoteVideo.classList.remove("hidden");
      updateVideoRowVisibility();
      remoteVideo.play().catch(() => {});
      if (callMode === "off") startCall("video");
    } else if (mode === "audio") {
      remoteVideo.classList.add("hidden");
      updateVideoRowVisibility();
      if (callMode === "off") startCall("audio");
    } else {
      remoteVideo.classList.add("hidden");
      updateVideoRowVisibility();
    }
  }

  function resetRemoteVideo() {
    const rv = document.getElementById("remoteVideo");
    rv.srcObject = null;
    rv.classList.add("hidden");
    remoteCallMode = "off";
    updateVideoRowVisibility();
  }

  async function attachLocalMediaTracks() {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    const videoTrack = localStream.getVideoTracks()[0];
    if (audioTrack && audioTransceiver) { try { await audioTransceiver.sender.replaceTrack(audioTrack); } catch (e) {} }
    if (videoTransceiver) { try { await videoTransceiver.sender.replaceTrack(videoTrack || null); } catch (e) {} }
    const localVideo = document.getElementById("localVideo");
    if (videoTrack) {
      localVideo.srcObject = localStream;
      localVideo.classList.remove("hidden");
    } else {
      localVideo.srcObject = null;
      localVideo.classList.add("hidden");
    }
    updateVideoRowVisibility();
  }

  const waitForIceComplete = (targetPc, maxWaitMs = 4000) => {
    if (targetPc.iceGatheringState === "complete") return Promise.resolve();
    return new Promise((resolve) => {
      const done = () => {
        targetPc.removeEventListener("icegatheringstatechange", onChange);
        resolve();
      };
      const onChange = () => {
        if (targetPc.iceGatheringState === "complete") done();
      };
      targetPc.addEventListener("icegatheringstatechange", onChange);
      setTimeout(done, maxWaitMs);
    });
  };

  const setupDataChannel = (dc) => {
    dc.binaryType = "arraybuffer";

    dc.onopen = () => {
      if (dataChannel !== dc) return;
      updateP2pBadge("connected");
      addMsg(everConnected ? "Direct P2P link re-established." : "Direct P2P link established. Chat and files now go peer-to-peer.", "sys");
      everConnected = true;
      if (callMode !== "off") dc.send(JSON.stringify({ type: "call-state", mode: callMode }));
    };

    dc.onclose = () => {
      if (dataChannel !== dc) return;
      updateP2pBadge("failed");
      if (incomingFileInfo) {
        if (incomingWriter) { try { incomingWriter.abort(); } catch (e) {} incomingWriter = null; }
        incomingFileData = [];
        finishTransferProgress(incomingFileInfo.transferId, "Interrupted -- connection lost");
        incomingFileInfo = null;
      }
      if (pendingFile) {
        finishTransferProgress(uploadTransferId, "Interrupted -- connection lost");
        pendingFile = null;
        uploadTransferId = null;
      }
    };

    dc.onmessage = (event) => {
      if (dataChannel !== dc) return;
      if (event.data instanceof ArrayBuffer) {
        if (!incomingFileInfo || downloadAbort) return; 
        incomingReceived += event.data.byteLength;
        if (incomingWriter) {
          incomingWriter.write(event.data).catch(() => {}); 
        } else {
          incomingFileData.push(event.data);
        }
        updateTransferProgress(incomingFileInfo.transferId, incomingReceived, incomingFileInfo.size, incomingStartTime);
        return;
      }

      try {
        const msg = JSON.parse(event.data);

        if (msg.type === "file-offer") {
          incomingFileInfo = msg;
          incomingFileData = [];
          const fileHtml = `
            <strong>File Offered:</strong> ${msg.name} (${formatBytes(msg.size)})<br>
            <button onclick="acceptFileTransfer('${msg.transferId}')" style="margin-top:8px; padding: 6px 12px; font-size: 13px; background: var(--green); color:#06210f;">Download File</button>
          `;
          addMsg(fileHtml, "them");
        }
        else if (msg.type === "file-accept") {
          if (msg.transferId === uploadTransferId) startFileTransfer();
        }
        else if (msg.type === "file-done") {
          if (incomingFileInfo && msg.transferId === incomingFileInfo.transferId) finishFileReceive();
        }
        else if (msg.type === "file-cancel") {
          if (msg.transferId === uploadTransferId) {
            uploadAbort = true;
            finishTransferProgress(uploadTransferId, "Cancelled by recipient");
            pendingFile = null;
            uploadTransferId = null;
          } else if (incomingFileInfo && msg.transferId === incomingFileInfo.transferId) {
            downloadAbort = true;
            if (incomingWriter) { try { incomingWriter.abort(); } catch (e) {} incomingWriter = null; }
            incomingFileData = [];
            finishTransferProgress(msg.transferId, "Cancelled by sender");
            incomingFileInfo = null;
          }
        }
        else if (msg.type === "call-state") {
          handleRemoteCallState(msg.mode);
        }
        else if (msg.type === "heartbeat") {
          recordHeartbeat("p2p");
          if (typeof msg.mode === "string") handleRemoteCallState(msg.mode);
        }
        else {
          addMsg(event.data, "them");
        }
      } catch (e) {
        addMsg(event.data, "them");
      }
    };
  };

  function enterHostWaitingState(message) {
    setAnnounce(null);
    inProgress = false;
    clearTimeout(buildTimeoutTimer);
    clearTimeout(watchdogTimer);
    if (pc) { try { pc.close(); } catch (e) {} }
    pc = null;
    resetRemoteVideo();
    updateP2pBadge("offline");
    updateStatus(message);
  }

  async function establishHostConnection() {
    inProgress = true;
    clearTimeout(buildTimeoutTimer);
    buildTimeoutTimer = setTimeout(() => { inProgress = false; }, 15000);
    setAnnounce(null);

    const oldPc = pc;
    hostSessionId = Math.random().toString(36).slice(2);
    const myPc = setupPeerConnection(true);
    if (oldPc) { try { oldPc.close(); } catch (e) {} }
    resetRemoteVideo();

    const dc = myPc.createDataChannel("chat");
    dataChannel = dc;
    setupDataChannel(dc);

    if (callMode !== "off" && localStream) await attachLocalMediaTracks();
    if (pc !== myPc) return;

    const offer = await myPc.createOffer();
    if (pc !== myPc) return;
    await myPc.setLocalDescription(offer);
    updateStatus("Gathering network candidates...");
    await waitForIceComplete(myPc);
    if (pc !== myPc) return;

    localSdp = myPc.localDescription.sdp;
    sdpKind = "offer";
    updateP2pBadge("connecting");
    updateStatus(everConnected
      ? "Re-negotiating direct connection..."
      : "Room is live -- you can chat now. Waiting for your friend to establish a direct P2P link...");
    setAnnounce(() => sendSignal({ kind: "offer", sdp: localSdp, sess: hostSessionId }));
  }

  async function handleHello() {
    if (inProgress) return; 
    if (everConnected) addMsg("Your friend reconnected -- re-establishing direct link...", "sys");
    establishHostConnection();
  }

  async function handleIncomingAnswer(msg) {
    if (!pc || msg.sess !== hostSessionId) return; 
    if (pc.signalingState !== "have-local-offer") return; 
    updateStatus("Answer received, establishing P2P connection...");
    await pc.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: msg.sdp }));
  }

  async function establishJoinConnection() {
    inProgress = true;
    clearTimeout(buildTimeoutTimer);
    buildTimeoutTimer = setTimeout(() => { inProgress = false; }, 15000);
    setAnnounce(null);

    const oldPc = pc;
    appliedSess = null;
    const myPc = setupPeerConnection(false);
    if (oldPc) { try { oldPc.close(); } catch (e) {} }
    resetRemoteVideo();

    myPc.ondatachannel = (event) => {
      if (pc !== myPc) return;
      dataChannel = event.channel;
      setupDataChannel(dataChannel);
    };

    updateP2pBadge("connecting");
    updateStatus(everConnected ? "Reconnecting to host..." : "Connected to signaling. Waiting for host...");
    setAnnounce(() => sendSignal({ kind: "hello" }));
  }

  async function handleIncomingOffer(msg) {
    if (msg.sess === appliedSess) {
      if (localSdp && sdpKind === "answer") sendSignal({ kind: "answer", sdp: localSdp, sess: msg.sess });
      return;
    }
    if (!pc) return;
    const targetPc = pc;
    appliedSess = msg.sess;

    updateStatus("Host found! Generating answer...");
    await targetPc.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: msg.sdp }));
    if (pc !== targetPc) return;

    const transceivers = targetPc.getTransceivers();
    audioTransceiver = transceivers.find(t => t.receiver.track?.kind === "audio");
    videoTransceiver = transceivers.find(t => t.receiver.track?.kind === "video");

    if (audioTransceiver) audioTransceiver.direction = "sendrecv";
    if (videoTransceiver) videoTransceiver.direction = "sendrecv";

    if (callMode !== "off" && localStream) await attachLocalMediaTracks();
    if (pc !== targetPc) return;

    const answer = await targetPc.createAnswer();
    if (pc !== targetPc) return;
    await targetPc.setLocalDescription(answer);
    updateStatus("Gathering network candidates...");
    await waitForIceComplete(targetPc);
    if (pc !== targetPc) return;

    localSdp = targetPc.localDescription.sdp;
    sdpKind = "answer";
    updateP2pBadge("connecting");
    updateStatus("Answer sent. Establishing direct connection...");
    setAnnounce(() => sendSignal({ kind: "answer", sdp: localSdp, sess: msg.sess }));
  }

  const announceCallState = (mode) => {
    if (dataChannel && dataChannel.readyState === "open") {
      dataChannel.send(JSON.stringify({ type: "call-state", mode }));
    }
  };

  async function startCall(mode) {
    if (callMode === mode || callStarting) return;
    if (!pc || pc.connectionState !== "connected") {
      addMsg(`${mode === "video" ? "Video" : "Voice"} calls need an active direct P2P connection -- still working on that.`, "sys");
      return;
    }
    callStarting = true;
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === "video" });
    } catch (e) {
      addMsg("Microphone/camera access was denied or unavailable.", "sys");
      callStarting = false;
      return;
    }
    callMode = mode;
    callStarting = false;
    await attachLocalMediaTracks();
    updateCallButtons();
    announceCallState(callMode);
  }

  async function stopCall() {
    if (callMode === "off") return;
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    if (audioTransceiver) { try { await audioTransceiver.sender.replaceTrack(null); } catch (e) {} }
    if (videoTransceiver) { try { await videoTransceiver.sender.replaceTrack(null); } catch (e) {} }
    document.getElementById("localVideo").srcObject = null;
    document.getElementById("localVideo").classList.add("hidden");
    callMode = "off";
    updateCallButtons();
    updateVideoRowVisibility();
    announceCallState("off");
  }

  async function toggleVoice() {
    if (callMode === "audio") {
      await stopCall();
      return;
    }
    await startCall("audio");
  }

  async function toggleVideo() {
    if (callMode === "video") {
      await stopCall();
      return;
    }
    await startCall("video");
  }

  function copyShareUrl() {
    const shareInput = document.getElementById("shareUrl");
    shareInput.select();
    navigator.clipboard.writeText(shareInput.value);
    updateStatus("Link copied to clipboard! Send it to your friend.");
  }

  function enterChatUI(isHost) {
    document.getElementById("actionButtons").classList.add("hidden");
    document.getElementById("roomName").disabled = true;
    document.getElementById("roomLabel").textContent = `Room: ${roomName}`;
    if (isHost) document.getElementById("copyLinkBtn").classList.remove("hidden");
    document.getElementById("chatUI").classList.remove("hidden");
    startHeartbeatLoop();
  }

  async function hostChat() {
    roomName = document.getElementById("roomName").value.trim() || "super-secret-chat-992";
    document.getElementById("roomName").value = roomName;
    role = "host";
    room = namespacedRoom(roomName);

    const url = new URL(window.location.href);
    url.searchParams.set("room", roomName);
    document.getElementById("shareUrl").value = url.toString();
    document.getElementById("shareContainer").classList.remove("hidden");

    try {
      updateStatus("Connecting to signaling server...");
      await connectSignaling();
    } catch (e) {
      updateStatus(e.message);
      return;
    }

    enterChatUI(true);
    enterHostWaitingState("Room is live -- waiting for your friend to join...");
  }

  async function joinChat() {
    roomName = document.getElementById("roomName").value.trim();
    if (!roomName) return alert("Please enter or paste a room name.");
    role = "join";
    room = namespacedRoom(roomName);

    try {
      updateStatus("Connecting to signaling server...");
      await connectSignaling();
    } catch (e) {
      updateStatus(e.message);
      return;
    }

    enterChatUI(false);
    establishJoinConnection();
  }

  function sendMsg() {
    const input = document.getElementById("msgInput");
    const val = input.value.trim();
    if (!val) return;
    const escapedVal = val.replace(/</g, "&lt;").replace(/>/g, "&gt;");

    if (dataChannel && dataChannel.readyState === "open") {
      dataChannel.send(escapedVal);
      addMsg(escapedVal, "me");
    } else if (room && sendSignal({ kind: "chat", text: escapedVal })) {
      addMsg(escapedVal + ' <span class="via-relay">(via relay)</span>', "me");
    } else {
      addMsg("Not connected yet -- message wasn't sent.", "sys");
      return;
    }
    input.value = "";
  }

  const chatUI = document.getElementById("chatUI");

  chatUI.addEventListener("dragover", (e) => {
    e.preventDefault();
    chatUI.classList.add("dragover");
  });

  chatUI.addEventListener("dragleave", (e) => {
    e.preventDefault();
    chatUI.classList.remove("dragover");
  });

  chatUI.addEventListener("drop", (e) => {
    e.preventDefault();
    chatUI.classList.remove("dragover");

    if (e.dataTransfer.files.length > 0) {
      if (!(dataChannel && dataChannel.readyState === "open")) {
        alert("You need a direct P2P connection (not just the relay) to send files.");
        return;
      }
      if (pendingFile) {
        alert("A file transfer is already in progress -- wait for it to finish (or cancel it) first.");
        return;
      }
      offerFile(e.dataTransfer.files[0]);
    }
  });

  window.handleFileSelect = function(event) {
    const files = event.target.files;
    if (files.length > 0) {
      if (!(dataChannel && dataChannel.readyState === "open")) {
        alert("You need a direct P2P connection (not just the relay) to send files.");
        event.target.value = "";
        return;
      }
      if (pendingFile) {
        alert("A file transfer is already in progress -- wait for it to finish (or cancel it) first.");
        event.target.value = "";
        return;
      }
      offerFile(files[0]);
      event.target.value = "";
    }
  };

  function transferProgressHtml(transferId, label, msgType) {
    const cancelFn = msgType === "me" ? "cancelUpload" : "cancelDownload";
    return `
      <div class="transfer" id="transfer-${transferId}">
        <div class="transfer-label">${label}</div>
        <div class="transfer-bar-track"><div class="transfer-bar-fill" id="transfer-fill-${transferId}"></div></div>
        <div class="transfer-meta">
          <span id="transfer-text-${transferId}">Starting...</span>
          <button onclick="${cancelFn}('${transferId}')">Cancel</button>
        </div>
      </div>
    `;
  }

  function showTransferProgress(transferId, label, msgType) {
    addMsg(transferProgressHtml(transferId, label, msgType), msgType);
  }

  function updateTransferProgress(transferId, done, total, startTime) {
    const fill = document.getElementById(`transfer-fill-${transferId}`);
    const text = document.getElementById(`transfer-text-${transferId}`);
    if (!fill || !text) return;
    const pct = total ? Math.min(100, (done / total) * 100) : 0;
    fill.style.width = pct.toFixed(1) + "%";
    const elapsed = (Date.now() - startTime) / 1000;
    const speed = elapsed > 0.2 ? done / elapsed : 0;
    let line = `${formatBytes(done)} / ${formatBytes(total)}`;
    if (speed > 0) line += ` -- ${formatBytes(speed)}/s`;
    if (done < total && speed > 0) line += ` -- ~${formatDuration((total - done) / speed)} left`;
    text.textContent = line;
  }

  function finishTransferProgress(transferId, finalLabel) {
    if (!transferId) return;
    const fill = document.getElementById(`transfer-fill-${transferId}`);
    const text = document.getElementById(`transfer-text-${transferId}`);
    if (fill) fill.style.width = "100%";
    if (text) text.textContent = finalLabel;
    const container = document.getElementById(`transfer-${transferId}`);
    const btn = container && container.querySelector("button");
    if (btn) btn.remove(); 
  }

  function offerFile(file) {
    pendingFile = file;
    uploadTransferId = genTransferId();
    uploadAbort = false;
    dataChannel.send(JSON.stringify({
      type: "file-offer",
      name: file.name,
      size: file.size,
      transferId: uploadTransferId
    }));
    addMsg(`<em>Offered file: ${file.name} (${formatBytes(file.size)}). Waiting for them to accept...</em>`, "me");
  }

  window.cancelUpload = function(transferId) {
    if (transferId !== uploadTransferId) return;
    uploadAbort = true;
    if (dataChannel && dataChannel.readyState === "open") {
      dataChannel.send(JSON.stringify({ type: "file-cancel", transferId }));
    }
    finishTransferProgress(transferId, "Cancelled");
  };

  async function startFileTransfer() {
    if (!pendingFile) return;
    const file = pendingFile;
    const dc = dataChannel;
    const transferId = uploadTransferId;
    const total = file.size;
    let offset = 0;
    let lastUiUpdate = 0;
    const startTime = Date.now();

    dc.bufferedAmountLowThreshold = BUFFER_LOW_WATERMARK;
    showTransferProgress(transferId, `Sending ${file.name}`, "me");

    while (offset < total) {
      if (uploadAbort || dataChannel !== dc || dc.readyState !== "open") break;

      if (dc.bufferedAmount > BUFFER_HIGH_WATERMARK) {
        await new Promise((resolve) => dc.addEventListener("bufferedamountlow", resolve, { once: true }));
        continue;
      }

      const buf = await file.slice(offset, offset + FILE_CHUNK_SIZE).arrayBuffer();
      if (uploadAbort || dataChannel !== dc || dc.readyState !== "open") break;

      dc.send(buf);
      offset += buf.byteLength;

      const now = Date.now();
      if (now - lastUiUpdate > 150 || offset >= total) {
        lastUiUpdate = now;
        updateTransferProgress(transferId, offset, total, startTime);
      }
    }

    if (uploadAbort) {
    } else if (dataChannel === dc && dc.readyState === "open" && offset >= total) {
      dc.send(JSON.stringify({ type: "file-done", transferId }));
      finishTransferProgress(transferId, "Sent");
    } else {
      finishTransferProgress(transferId, "Upload interrupted -- connection lost");
    }

    pendingFile = null;
    uploadTransferId = null;
  }

  window.acceptFileTransfer = async function(transferId) {
    if (!incomingFileInfo || incomingFileInfo.transferId !== transferId) return;
    const info = incomingFileInfo;
    downloadAbort = false;
    incomingReceived = 0;
    incomingStartTime = Date.now();
    incomingWriter = null;
    incomingFileData = [];

    if (typeof window.showSaveFilePicker === "function") {
      try {
        const handle = await window.showSaveFilePicker({ suggestedName: info.name });
        incomingWriter = await handle.createWritable();
      } catch (e) {
        if (e && e.name === "AbortError") {
          addMsg("Download cancelled.", "sys");
          incomingFileInfo = null;
          return;
        }
        incomingWriter = null; 
      }
    }

    dataChannel.send(JSON.stringify({ type: "file-accept", transferId }));
    showTransferProgress(transferId, `Receiving ${info.name}`, "them");
  };

  window.cancelDownload = function(transferId) {
    if (!incomingFileInfo || incomingFileInfo.transferId !== transferId) return;
    downloadAbort = true;
    if (dataChannel && dataChannel.readyState === "open") {
      dataChannel.send(JSON.stringify({ type: "file-cancel", transferId }));
    }
    if (incomingWriter) { try { incomingWriter.abort(); } catch (e) {} incomingWriter = null; }
    incomingFileData = [];
    finishTransferProgress(transferId, "Cancelled");
    incomingFileInfo = null;
  };

  async function finishFileReceive() {
    const info = incomingFileInfo;
    if (!info) return;

    if (incomingWriter) {
      try {
        // UPDATE: Inject a progress notice before awaiting the final flush to disk.
        const textElement = document.getElementById(`transfer-text-${info.transferId}`);
        if (textElement) {
          textElement.innerHTML = "<span style='color: var(--amber);'>Saving to disk... please wait.</span>";
        }
        
        await incomingWriter.close();
        addMsg(`<strong>File saved:</strong> ${info.name}`, "them");
      } catch (e) {
        addMsg(`Something went wrong saving ${info.name}: ${e && e.message ? e.message : e}`, "sys");
      }
      incomingWriter = null;
    } else {
      const blob = new Blob(incomingFileData);
      const url = URL.createObjectURL(blob);
      const fileHtml = `
        <strong>File Received!</strong><br>
        <a href="${url}" download="${info.name}" style="font-weight: bold; text-decoration: underline; display: inline-block; margin-top: 5px;">
          Save ${info.name}
        </a>
      `;
      addMsg(fileHtml, "them");
    }

    finishTransferProgress(info.transferId, "Received");
    incomingFileInfo = null;
    incomingFileData = [];
  }

  window.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const roomParam = params.get("room");

    if (!getSignalingUrl()) {
      updateStatus('No signaling server set. Add "?signaling=your-ws-host" to this page\'s URL (e.g. ?signaling=xxxx.xxxxx.workers.dev).');
      return;
    }

    if (roomParam) {
      document.getElementById("roomName").value = roomParam;
      document.getElementById("roomName").disabled = true;
      document.getElementById("hostBtn").classList.add("hidden");

      updateStatus(`Invite link detected for room "${roomParam}". Connecting...`);
      joinChat();
    }
  });
</script>
