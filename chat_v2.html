<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P WebRTC Chat & File Transfer</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #191b21;
    --panel-2: #14161b;
    --border: #2a2d36;
    --text: #e6e7eb;
    --text-dim: #9aa0ac;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --green: #22c55e;
    --amber: #eab308;
    --red: #ef4444;
    --teal: #14b8a6;
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 600px;
    margin: 2rem auto;
    padding: 0 1rem;
    background-color: var(--bg);
    color: var(--text);
  }
  h2 { color: var(--text); }

  .controls {
    margin-bottom: 15px;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  input[type="text"] {
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 16px;
    background: var(--panel-2);
    color: var(--text);
  }
  input[type="text"]:disabled { opacity: 0.6; }
  input[type="text"]::placeholder { color: var(--text-dim); }

  button {
    padding: 10px 16px;
    cursor: pointer;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    transition: background 0.2s;
  }
  button:hover { background: var(--accent-hover); }

  .share-box {
    margin-top: 15px;
    padding: 12px;
    background: #12202f;
    border: 1px solid #234b6e;
    border-radius: 6px;
  }
  .share-box label { color: #7fb3e8; }

  #chatUI {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 15px;
    border-radius: 8px;
    transition: background 0.3s, border-color 0.3s;
  }

  #chatUI.dragover {
    background: #16233a;
    border: 2px dashed var(--accent);
  }

  #connBadges {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78em;
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 600;
  }
  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #666;
    flex-shrink: 0;
  }
  .badge.state-live .dot, .badge.state-connected .dot { background: var(--green); }
  .badge.state-connecting .dot { background: var(--amber); }
  .badge.state-offline .dot, .badge.state-failed .dot { background: var(--red); }

  #mediaControls { margin-bottom: 12px; }
  #mediaControls button {
    font-size: 13px;
    padding: 6px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  #mediaControls button:hover { background: #21242c; }
  #mediaControls button.active { background: var(--green); color: #06210f; border-color: var(--green); }

  .roomBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.85em;
    color: var(--text-dim);
  }
  .roomBar button {
    font-size: 12px;
    padding: 5px 10px;
    background: var(--teal);
    color: #04211d;
  }

  #chatBox {
    border: 1px solid var(--border);
    height: 350px;
    overflow-y: auto;
    padding: 15px;
    margin-bottom: 15px;
    background: var(--panel-2);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
  }

  .msg {
    margin: 5px 0;
    padding: 10px 14px;
    border-radius: 18px;
    width: fit-content;
    max-width: 75%;
    word-wrap: break-word;
  }
  .me {
    background: var(--accent);
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .them {
    background: #262932;
    color: var(--text);
    margin-right: auto;
    border-bottom-left-radius: 4px;
  }
  .sys {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85em;
    margin: 10px auto;
  }
  .via-relay {
    opacity: 0.8;
    font-size: 0.8em;
    font-weight: normal;
  }
  a { color: #7fb3e8; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h2>Secure P2P Chat</h2>

<div class="controls" id="setupUI">
  <label style="font-weight: bold; display: block; margin-bottom: 8px;">Room Name / ID:</label>
  <input type="text" id="roomName" placeholder="super-secret-chat-992" style="width: 100%; box-sizing: border-box; margin-bottom: 15px;">

  <div id="actionButtons" style="display: flex; gap: 10px;">
    <button id="hostBtn" onclick="hostChat()" style="flex: 1;">1. Host Chat</button>
    <button id="joinBtn" onclick="joinChat()" style="flex: 1; background: var(--green); color: #06210f;">2. Join Chat</button>
  </div>

  <div id="shareContainer" class="share-box hidden">
    <label style="font-size: 0.9em; font-weight: bold; display: block; margin-bottom: 5px;">Share this link with your friend:</label>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="shareUrl" readonly style="flex: 1; font-size: 14px;">
      <button onclick="copyShareUrl()" style="background: var(--teal); color: #04211d; padding: 8px 12px; font-size: 14px;">Copy Link</button>
    </div>
  </div>

  <p id="status" class="sys" style="text-align: left; margin-top: 15px;">Status: Waiting for input...</p>
</div>

<div id="chatUI" class="hidden">
  <div class="roomBar">
    <span id="roomLabel"></span>
    <button id="copyLinkBtn" class="hidden" onclick="copyShareUrl()">Copy Invite Link</button>
  </div>

  <div id="connBadges">
    <span id="wsBadge" class="badge state-offline"><span class="dot"></span><span class="label">Signaling: offline</span></span>
    <span id="p2pBadge" class="badge state-offline"><span class="dot"></span><span class="label">P2P: not connected</span></span>
    <span id="peerBadge" class="badge state-offline"><span class="dot"></span><span class="label">Peer: not connected</span></span>
  </div>

  <div id="mediaControls">
    <button id="videoToggleBtn" onclick="toggleVideo()">Start Video</button>
  </div>

  <div id="videoRow" class="hidden" style="display: flex; gap: 10px; margin-bottom: 15px;">
    <video id="localVideo" class="hidden" autoplay muted playsinline style="flex: 1; min-width: 0; border-radius: 8px; background: #000;"></video>
    <video id="remoteVideo" class="hidden" autoplay playsinline style="flex: 1; min-width: 0; border-radius: 8px; background: #000;"></video>
  </div>

  <p class="sys" style="margin-top: 0;">Drag and drop files here to send them! (needs a direct P2P connection)</p>

  <div id="chatBox"></div>
  <div style="display: flex; gap: 10px;">
    <input type="text" id="msgInput" placeholder="Type a message..." style="flex: 1;" onkeypress="if(event.key === 'Enter') sendMsg()">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  let pc = null;
  let dataChannel = null;
  let roomName = "";        // human-entered room name
  let room = "";              // namespaced room id used on the wire
  let role = null;            // "host" | "join"
  let signalingUrl = null;

  let ws = null;
  let wsShouldRun = false;    // true once the user has started hosting/joining
  let reconnectAttempts = 0;
  let reconnectTimer = null;

  // A "session" is one attempt by the host at a fresh RTCPeerConnection.
  // Every offer carries the host's current session id; the joiner only
  // ever treats an offer as brand new (rebuilding its own peer connection
  // to match) when the session id changes. This is what makes recovery
  // correct regardless of which side dropped or reloaded, without relying
  // on guessing from timing.
  let hostSessionId = null;   // set by the host, echoed back by the answer
  let appliedSess = null;     // last session id the joiner has answered

  let localSdp = null;        // our current offer (host) or answer (join)
  let sdpKind = null;         // "offer" | "answer"
  let inProgress = false;     // a (re)negotiation attempt is under way
  let everConnected = false;  // has the data channel ever opened this session
  let buildTimeoutTimer = null;
  let watchdogTimer = null;

  let announceTimer = null;
  let pendingAnnounce = null; // fn re-sent on a timer until cleared

  let pendingFile = null;
  let incomingFileInfo = null;
  let incomingFileData = [];

  let audioTransceiver, videoTransceiver;
  let localStream = null;
  let videoEnabled = false;

  // ---------------------------------------------------------------------
  // Heartbeat: proof that the OTHER PERSON's browser is actually there,
  // as opposed to "my signaling socket happens to be open" or "my
  // RTCPeerConnection object says connected". Every second we send a tiny
  // {type:"heartbeat", video: <our current camera state>} -- over the P2P
  // data channel when it's open (that's the more trustworthy, lowest-
  // latency path), falling back to the WS relay otherwise. Whichever path
  // last delivered one wins for display purposes. If nothing arrives for
  // HEARTBEAT_TIMEOUT_MS the peer badge goes red, regardless of what the
  // signaling/P2P badges (which only describe OUR OWN link state) say.
  //
  // Piggybacking our video flag on every beat also makes video-state
  // self-healing: if a "video-state" message ever gets lost (e.g. right
  // in the middle of a renegotiation), the next heartbeat re-syncs both
  // sides' start/stop button within a second instead of leaving them
  // stuck out of sync.
  // ---------------------------------------------------------------------
  const HEARTBEAT_INTERVAL_MS = 1000;
  const HEARTBEAT_TIMEOUT_MS = 3000;
  let heartbeatTimer = null;
  let lastPeerHeartbeat = 0;   // Date.now() of the last beat we received
  let lastHeartbeatVia = null; // "p2p" | "relay"

  const APP_NS = "qk7x2v9p";
  const namespacedRoom = (name) => `${APP_NS}:${name}`;

  const iceServers = {
    iceServers: [
      { urls: [
          "stun:stun.l.google.com:19302",
          "stun:stun1.l.google.com:19302",
          "stun:stun2.l.google.com:19302"
        ] },
      { urls: "stun:stun.cloudflare.com:3478" }
    ]
  };

  // ---------------------------------------------------------------------
  // Small UI helpers
  // ---------------------------------------------------------------------
  const updateStatus = (text) => {
    document.getElementById("status").textContent = "Status: " + text;
  };

  const addMsg = (text, type) => {
    const box = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerHTML = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  };

  function formatBytes(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }

  const getRandomSuffix = () => Math.random().toString(36).substring(2, 8);

  const setBadge = (id, state, label) => {
    const el = document.getElementById(id);
    el.className = "badge state-" + state;
    el.querySelector(".label").textContent = label;
  };

  const updateWsBadge = (state) => {
    const labels = {
      offline: "Signaling: offline",
      connecting: "Signaling: connecting...",
      live: "Signaling: live",
      reconnecting: "Signaling: reconnecting..."
    };
    setBadge("wsBadge", state, labels[state] || state);
  };

  const updateP2pBadge = (state) => {
    const labels = {
      offline: "P2P: not connected",
      connecting: "P2P: connecting...",
      connected: "P2P: connected (direct)",
      failed: "P2P: unavailable (using relay)"
    };
    setBadge("p2pBadge", state, labels[state] || state);
  };

  const updatePeerBadge = () => {
    if (!lastPeerHeartbeat) {
      setBadge("peerBadge", "connecting", "Peer: waiting...");
      return;
    }
    const age = Date.now() - lastPeerHeartbeat;
    if (age > HEARTBEAT_TIMEOUT_MS) {
      setBadge("peerBadge", "offline", "Peer: offline");
    } else {
      setBadge("peerBadge", "live", `Peer: online (${lastHeartbeatVia === "p2p" ? "P2P" : "relay"})`);
    }
  };

  const updateVideoBtn = () => {
    const btn = document.getElementById("videoToggleBtn");
    btn.textContent = videoEnabled ? "Stop Video" : "Start Video";
    btn.classList.toggle("active", videoEnabled);
  };

  // ---------------------------------------------------------------------
  // Announce loop: re-sends whatever `pendingAnnounce` currently is every
  // 1.5s until cleared. Used for the host re-broadcasting its offer, and
  // for the joiner re-broadcasting either "hello" (looking for a host) or
  // its answer -- all driven by the same simple, uniform mechanism so
  // nothing is ever just sent once and hoped for.
  // ---------------------------------------------------------------------
  function setAnnounce(fn) {
    pendingAnnounce = fn;
    clearInterval(announceTimer);
    announceTimer = null;
    if (fn) {
      fn();
      announceTimer = setInterval(() => { if (pendingAnnounce) pendingAnnounce(); }, 1500);
    }
  }

  // ---------------------------------------------------------------------
  // Signaling: a WebSocket relay that broadcasts each message to every
  // OTHER connected client (never back to the sender), with no storage or
  // replay. Every message carries a `room` field so peers can tell "for
  // me" apart from "for someone else" sharing the same relay. The same
  // socket also carries plain chat text, used as a fallback whenever the
  // direct P2P data channel isn't (yet, or isn't currently) open.
  // ---------------------------------------------------------------------
  const getSignalingUrl = () => {
    const params = new URLSearchParams(window.location.search);
    let sig = params.get("signaling");
    if (!sig) return null;
    sig = sig.trim();
    if (!/^wss?:\/\//i.test(sig)) sig = "wss://" + sig;
    return sig;
  };

  const sendSignal = (payload) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return false;
    ws.send(JSON.stringify({ room, ...payload }));
    return true;
  };

  function handleSignalMessage(event) {
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch (e) {
      return;
    }
    if (!msg || msg.room !== room) return;

    if (msg.kind === "chat") {
      addMsg(msg.text, "them");
    } else if (msg.kind === "hello" && role === "host") {
      handleHello();
    } else if (msg.kind === "offer" && role === "join") {
      handleIncomingOffer(msg);
    } else if (msg.kind === "answer" && role === "host") {
      handleIncomingAnswer(msg);
    } else if (msg.kind === "heartbeat") {
      recordHeartbeat("relay");
      if (typeof msg.video === "boolean") handleRemoteVideoState(msg.video);
    }
  }

  // Records a beat from the peer, no matter which transport it rode in on,
  // and immediately refreshes the badge so the "online (P2P)" / "online
  // (relay)" label always reflects the most recent delivery path.
  function recordHeartbeat(via) {
    lastPeerHeartbeat = Date.now();
    lastHeartbeatVia = via;
    updatePeerBadge();
  }

  // P2P first (more direct, lower latency, and proves the actual media
  // path is alive) -- WS relay only as a fallback when there's no open
  // data channel to ride on.
  function sendHeartbeat() {
    const payload = { type: "heartbeat", video: videoEnabled };
    if (dataChannel && dataChannel.readyState === "open") {
      dataChannel.send(JSON.stringify(payload));
    } else if (ws && ws.readyState === WebSocket.OPEN && room) {
      sendSignal({ kind: "heartbeat", video: videoEnabled });
    }
  }

  function startHeartbeatLoop() {
    stopHeartbeatLoop();
    sendHeartbeat();
    updatePeerBadge();
    heartbeatTimer = setInterval(() => {
      sendHeartbeat();
      updatePeerBadge(); // re-check staleness every tick even if nothing new arrived
    }, HEARTBEAT_INTERVAL_MS);
  }

  function stopHeartbeatLoop() {
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
  }

  function openSignalingSocket() {
    updateWsBadge(reconnectAttempts > 0 ? "reconnecting" : "connecting");
    try {
      ws = new WebSocket(signalingUrl);
    } catch (e) {
      scheduleReconnect();
      return;
    }

    ws.addEventListener("open", () => {
      reconnectAttempts = 0;
      updateWsBadge("live");
      // Don't wait for the next scheduled tick to resume whatever we were
      // mid-way through announcing.
      if (pendingAnnounce) pendingAnnounce();
    });

    ws.addEventListener("message", handleSignalMessage);

    ws.addEventListener("close", () => {
      if (!wsShouldRun) return;
      scheduleReconnect();
    });
  }

  function scheduleReconnect() {
    if (!wsShouldRun) return;
    updateWsBadge("offline");
    clearTimeout(reconnectTimer);
    reconnectAttempts++;
    const delay = Math.min(1000 * 2 ** reconnectAttempts, 10000);
    reconnectTimer = setTimeout(openSignalingSocket, delay);
  }

  // Kicks off the signaling connection and resolves once it's open the
  // first time (rejects if there's no ?signaling= param at all).
  const connectSignaling = () => {
    return new Promise((resolve, reject) => {
      signalingUrl = getSignalingUrl();
      if (!signalingUrl) {
        reject(new Error("No signaling server set. Add ?signaling=your-ws-host to the page URL."));
        return;
      }
      wsShouldRun = true;
      reconnectAttempts = 0;

      const timeout = setTimeout(() => {
        reject(new Error("Could not reach signaling server: " + signalingUrl));
      }, 7000);

      openSignalingSocket();
      ws.addEventListener("open", () => {
        clearTimeout(timeout);
        resolve();
      }, { once: true });
    });
  };

  // ---------------------------------------------------------------------
  // WebRTC peer connection lifecycle
  // ---------------------------------------------------------------------
  const setupPeerConnection = (isHost) => {
    const myPc = new RTCPeerConnection(iceServers);
    pc = myPc;

    myPc.onconnectionstatechange = () => {
      if (pc !== myPc) return;
      const state = myPc.connectionState;
      if (state === "connected") {
        updateP2pBadge("connected");
        setAnnounce(null);
        inProgress = false;
        clearTimeout(buildTimeoutTimer);
        clearTimeout(watchdogTimer);
      } else if (state === "connecting" || state === "new") {
        updateP2pBadge("connecting");
      } else if (state === "failed" || state === "closed") {
        updateP2pBadge("failed");
        clearTimeout(watchdogTimer);
        triggerReconnect(myPc);
      } else if (state === "disconnected") {
        updateP2pBadge("failed");
        clearTimeout(watchdogTimer);
        // Brief network blips can self-heal -- give it a few seconds
        // before tearing everything down and starting over.
        watchdogTimer = setTimeout(() => {
          if (pc === myPc && myPc.connectionState !== "connected") triggerReconnect(myPc);
        }, 4000);
      }
    };

    myPc.ontrack = (event) => {
      if (pc !== myPc) return;
      const track = event.track;
      const remoteVideo = document.getElementById("remoteVideo");
      if (!remoteVideo.srcObject) remoteVideo.srcObject = new MediaStream();
      remoteVideo.srcObject.addTrack(track);
      
      // Force the video element to recognize the newly added track (fixes Safari/Chrome bugs)
      remoteVideo.srcObject = remoteVideo.srcObject;
      remoteVideo.play().catch(() => {});
    };

    if (isHost) {
      // Always negotiate bi-directional audio/video pipes up front
      audioTransceiver = myPc.addTransceiver("audio", { direction: "sendrecv" });
      videoTransceiver = myPc.addTransceiver("video", { direction: "sendrecv" });

      // FIX: The host created these transceivers, so 'ontrack' won't fire for them.
      // We must manually attach the synchronously created receiver tracks right now.
      const remoteVideo = document.getElementById("remoteVideo");
      if (!remoteVideo.srcObject) remoteVideo.srcObject = new MediaStream();
      remoteVideo.srcObject.addTrack(audioTransceiver.receiver.track);
      remoteVideo.srcObject.addTrack(videoTransceiver.receiver.track);
      remoteVideo.srcObject = remoteVideo.srcObject;
    }

    return myPc;
  };

  function triggerReconnect(fromPc) {
    if (fromPc !== pc) return;
    if (inProgress) return;

    if (role === "host") {
      // Only worth rebuilding + re-broadcasting our offer if a heartbeat
      // (over either transport) proves someone is still actually in the
      // room to receive it -- otherwise go quiet and wait for a fresh
      // "hello" instead of blasting SDP into an empty room every 1.5s.
      const peerRecentlySeen = lastPeerHeartbeat && (Date.now() - lastPeerHeartbeat < HEARTBEAT_TIMEOUT_MS);
      if (peerRecentlySeen) {
        addMsg(everConnected ? "Direct P2P link lost -- reconnecting..." : "Still trying to establish a direct link...", "sys");
        establishHostConnection();
      } else {
        if (everConnected) addMsg("Direct P2P link lost, and your friend seems to have left -- waiting for them to come back...", "sys");
        enterHostWaitingState("Waiting for your friend to (re)join...");
      }
    } else {
      addMsg(everConnected ? "Direct P2P link lost -- reconnecting..." : "Still trying to establish a direct link...", "sys");
      establishJoinConnection();
    }
  }

  function updateVideoRowVisibility() {
    const row = document.getElementById("videoRow");
    const lv = document.getElementById("localVideo");
    const rv = document.getElementById("remoteVideo");
    const anyVisible = !lv.classList.contains("hidden") || !rv.classList.contains("hidden");
    row.classList.toggle("hidden", !anyVisible);
  }

  // Whether the peer's camera is currently on, per their own explicit
  // announcement (see startLocalVideo/stopLocalVideo). Driving the remote
  // video box off this app-level message -- rather than the browser's
  // low-level track mute/unmute events, which are unreliable for a
  // "m-line negotiated sendrecv but no track attached yet" transceiver --
  // is what makes both the box and the mirror-start actually work.
  let remoteVideoOn = false;

  function handleRemoteVideoState(enabled) {
    if (enabled === remoteVideoOn) return; // already in sync -- also makes this safe to call from every heartbeat
    remoteVideoOn = enabled;
    const remoteVideo = document.getElementById("remoteVideo");
    if (enabled) {
      remoteVideo.classList.remove("hidden");
      updateVideoRowVisibility();
      remoteVideo.play().catch(() => {});
      if (!videoEnabled) startLocalVideo(); // mirror: they started video, so do we
    } else {
      remoteVideo.classList.add("hidden");
      updateVideoRowVisibility();
      if (videoEnabled) stopLocalVideo(); // mirror: they stopped video, so do we
    }
  }

  function resetRemoteVideo() {
    const rv = document.getElementById("remoteVideo");
    rv.srcObject = null;
    rv.classList.add("hidden");
    remoteVideoOn = false;
    updateVideoRowVisibility();
  }

  async function attachLocalMediaTracks() {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    const videoTrack = localStream.getVideoTracks()[0];
    if (audioTrack && audioTransceiver) { try { await audioTransceiver.sender.replaceTrack(audioTrack); } catch (e) {} }
    if (videoTrack && videoTransceiver) { try { await videoTransceiver.sender.replaceTrack(videoTrack); } catch (e) {} }
    const localVideo = document.getElementById("localVideo");
    localVideo.srcObject = localStream;
    localVideo.classList.remove("hidden");
    updateVideoRowVisibility();
  }

  const waitForIceComplete = (targetPc, maxWaitMs = 4000) => {
    if (targetPc.iceGatheringState === "complete") return Promise.resolve();
    return new Promise((resolve) => {
      const done = () => {
        targetPc.removeEventListener("icegatheringstatechange", onChange);
        resolve();
      };
      const onChange = () => {
        if (targetPc.iceGatheringState === "complete") done();
      };
      targetPc.addEventListener("icegatheringstatechange", onChange);
      setTimeout(done, maxWaitMs);
    });
  };

  const setupDataChannel = (dc) => {
    dc.binaryType = "arraybuffer";

    dc.onopen = () => {
      if (dataChannel !== dc) return;
      updateP2pBadge("connected");
      addMsg(everConnected ? "Direct P2P link re-established." : "Direct P2P link established. Chat and files now go peer-to-peer.", "sys");
      everConnected = true;
      // Our own audio/video tracks were already reattached to the fresh
      // transceivers before this offer/answer went out (if videoEnabled),
      // but the peer has no way to know that unless we tell them again --
      // their remote video box was reset to hidden on their side too.
      if (videoEnabled) dc.send(JSON.stringify({ type: "video-state", enabled: true }));
    };

    dc.onclose = () => {
      if (dataChannel !== dc) return;
      updateP2pBadge("failed");
    };

    dc.onmessage = (event) => {
      if (dataChannel !== dc) return;
      if (event.data instanceof ArrayBuffer) {
        incomingFileData.push(event.data);
        return;
      }

      try {
        const msg = JSON.parse(event.data);

        if (msg.type === "file-offer") {
          incomingFileInfo = msg;
          incomingFileData = [];
          const fileHtml = `
            <strong>File Offered:</strong> ${msg.name} (${formatBytes(msg.size)})<br>
            <button onclick="acceptFileTransfer()" style="margin-top:8px; padding: 6px 12px; font-size: 13px; background: var(--green); color:#06210f;">Download File</button>
          `;
          addMsg(fileHtml, "them");
        }
        else if (msg.type === "file-accept") {
          startFileTransfer();
        }
        else if (msg.type === "file-done") {
          finishFileReceive();
        }
        else if (msg.type === "video-state") {
          handleRemoteVideoState(msg.enabled);
        }
        else if (msg.type === "heartbeat") {
          recordHeartbeat("p2p");
          if (typeof msg.video === "boolean") handleRemoteVideoState(msg.video);
        }
        else {
          addMsg(event.data, "them");
        }
      } catch (e) {
        addMsg(event.data, "them");
      }
    };
  };

  // ---------------------------------------------------------------------
  // Host: (re)build a fresh RTCPeerConnection + offer, and keep
  // re-broadcasting that offer over signaling until an answer for this
  // exact session comes back. Called on first connect AND every time we
  // need to recover -- there's only one path, so the host never needs a
  // manual restart.
  // ---------------------------------------------------------------------
  // ---------------------------------------------------------------------
  // Host: while no one has said "hello" yet (or the peer has gone stale --
  // see triggerReconnect below), just sit quietly instead of building and
  // re-broadcasting the offer every 1.5s. The offer carries the full SDP,
  // which can run into many KB once video m-lines are in play, so blasting
  // it into a room nobody is listening in is pure waste on the signaling
  // server. "hello" is tiny and the joiner already announces it on its own
  // loop the whole time it isn't connected, so we lose nothing by waiting
  // for one before spending any bandwidth.
  // ---------------------------------------------------------------------
  function enterHostWaitingState(message) {
    setAnnounce(null);
    inProgress = false;
    clearTimeout(buildTimeoutTimer);
    clearTimeout(watchdogTimer);
    if (pc) { try { pc.close(); } catch (e) {} }
    pc = null;
    resetRemoteVideo();
    updateP2pBadge("offline");
    updateStatus(message);
  }

  async function establishHostConnection() {
    inProgress = true;
    clearTimeout(buildTimeoutTimer);
    buildTimeoutTimer = setTimeout(() => { inProgress = false; }, 15000);
    setAnnounce(null);

    const oldPc = pc;
    hostSessionId = Math.random().toString(36).slice(2);
    const myPc = setupPeerConnection(true);
    if (oldPc) { try { oldPc.close(); } catch (e) {} }
    resetRemoteVideo();

    const dc = myPc.createDataChannel("chat");
    dataChannel = dc;
    setupDataChannel(dc);

    if (videoEnabled && localStream) await attachLocalMediaTracks();
    if (pc !== myPc) return;

    const offer = await myPc.createOffer();
    if (pc !== myPc) return;
    await myPc.setLocalDescription(offer);
    updateStatus("Gathering network candidates...");
    await waitForIceComplete(myPc);
    if (pc !== myPc) return;

    localSdp = myPc.localDescription.sdp;
    sdpKind = "offer";
    updateP2pBadge("connecting");
    updateStatus(everConnected
      ? "Re-negotiating direct connection..."
      : "Room is live -- you can chat now. Waiting for your friend to establish a direct P2P link...");
    setAnnounce(() => sendSignal({ kind: "offer", sdp: localSdp, sess: hostSessionId }));
  }

  async function handleHello() {
    if (inProgress) return; // already (re)negotiating -- a hello mid-flight is redundant
    if (everConnected) addMsg("Your friend reconnected -- re-establishing direct link...", "sys");
    establishHostConnection();
  }

  async function handleIncomingAnswer(msg) {
    if (!pc || msg.sess !== hostSessionId) return; // stale / not our current session
    if (pc.signalingState !== "have-local-offer") return; // already applied
    updateStatus("Answer received, establishing P2P connection...");
    await pc.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: msg.sdp }));
  }

  // ---------------------------------------------------------------------
  // Joiner: announce "hello" until an offer shows up. An offer whose
  // session id we haven't already answered means either "first offer
  // ever" or "the host rebuilt" -- either way we build a fresh peer
  // connection to match it rather than trying to reuse a possibly-stale
  // one. A repeated offer for a session we've already answered just gets
  // its answer resent (it means our answer hasn't reached the host yet).
  // ---------------------------------------------------------------------
  async function establishJoinConnection() {
    inProgress = true;
    clearTimeout(buildTimeoutTimer);
    buildTimeoutTimer = setTimeout(() => { inProgress = false; }, 15000);
    setAnnounce(null);

    const oldPc = pc;
    appliedSess = null;
    const myPc = setupPeerConnection(false);
    if (oldPc) { try { oldPc.close(); } catch (e) {} }
    resetRemoteVideo();

    myPc.ondatachannel = (event) => {
      if (pc !== myPc) return;
      dataChannel = event.channel;
      setupDataChannel(dataChannel);
    };

    updateP2pBadge("connecting");
    updateStatus(everConnected ? "Reconnecting to host..." : "Connected to signaling. Waiting for host...");
    setAnnounce(() => sendSignal({ kind: "hello" }));
  }

  async function handleIncomingOffer(msg) {
    if (msg.sess === appliedSess) {
      // Duplicate of an offer we already answered -- our answer likely
      // hasn't reached the host yet, so just resend it.
      if (localSdp && sdpKind === "answer") sendSignal({ kind: "answer", sdp: localSdp, sess: msg.sess });
      return;
    }
    if (!pc) return;
    const targetPc = pc;
    appliedSess = msg.sess;

    updateStatus("Host found! Generating answer...");
    await targetPc.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: msg.sdp }));
    if (pc !== targetPc) return;

    const transceivers = targetPc.getTransceivers();
    audioTransceiver = transceivers.find(t => t.receiver.track?.kind === "audio");
    videoTransceiver = transceivers.find(t => t.receiver.track?.kind === "video");

    // A transceiver auto-created by processing a remote offer defaults to
    // "recvonly" -- the browser has no way to know we intend to send too
    // until we say so. Left alone, the answer we're about to generate
    // would lock in "we only receive", and our video would never actually
    // leave this side even though replaceTrack() succeeds in JS. Force
    // both to sendrecv so the answer negotiates a real bidirectional pipe.
    if (audioTransceiver) audioTransceiver.direction = "sendrecv";
    if (videoTransceiver) videoTransceiver.direction = "sendrecv";

    if (videoEnabled && localStream) await attachLocalMediaTracks();
    if (pc !== targetPc) return;

    const answer = await targetPc.createAnswer();
    if (pc !== targetPc) return;
    await targetPc.setLocalDescription(answer);
    updateStatus("Gathering network candidates...");
    await waitForIceComplete(targetPc);
    if (pc !== targetPc) return;

    localSdp = targetPc.localDescription.sdp;
    sdpKind = "answer";
    updateP2pBadge("connecting");
    updateStatus("Answer sent. Establishing direct connection...");
    setAnnounce(() => sendSignal({ kind: "answer", sdp: localSdp, sess: msg.sess }));
  }

  // ---------------------------------------------------------------------
  // Video: on-demand, either side, any time P2P is up. Audio/video
  // m-lines are already negotiated from the very first offer (see
  // setupPeerConnection), so turning this on is just grabbing a stream
  // and attaching it to the existing transceivers -- no renegotiation,
  // and the browser only prompts for camera/mic permission once.
  //
  // Starting your video also mirror-starts the other side's, driven by
  // an explicit "video-state" message over the data channel rather than
  // WebRTC's own track mute/unmute events (see handleRemoteVideoState).
  // ---------------------------------------------------------------------
  let videoStarting = false;

  const announceVideoState = (enabled) => {
    if (dataChannel && dataChannel.readyState === "open") {
      dataChannel.send(JSON.stringify({ type: "video-state", enabled }));
    }
  };

  async function startLocalVideo() {
    if (videoEnabled || videoStarting) return;
    if (!pc || pc.connectionState !== "connected") return;
    videoStarting = true;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    } catch (e) {
      addMsg("Camera/mic access was denied or unavailable.", "sys");
      videoStarting = false;
      return;
    }
    videoEnabled = true;
    videoStarting = false;
    await attachLocalMediaTracks();
    updateVideoBtn();
    announceVideoState(true);
  }

  async function stopLocalVideo() {
    if (!videoEnabled) return;
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    if (audioTransceiver) { try { await audioTransceiver.sender.replaceTrack(null); } catch (e) {} }
    if (videoTransceiver) { try { await videoTransceiver.sender.replaceTrack(null); } catch (e) {} }
    document.getElementById("localVideo").srcObject = null;
    document.getElementById("localVideo").classList.add("hidden");
    videoEnabled = false;
    updateVideoBtn();
    updateVideoRowVisibility();
    announceVideoState(false);
  }

  async function toggleVideo() {
    if (videoEnabled) {
      await stopLocalVideo();
      return;
    }
    if (!pc || pc.connectionState !== "connected") {
      addMsg("Video needs an active direct P2P connection -- still working on that.", "sys");
      return;
    }
    await startLocalVideo();
  }

  // ---------------------------------------------------------------------
  // Setup / room flow
  // ---------------------------------------------------------------------
  function copyShareUrl() {
    const shareInput = document.getElementById("shareUrl");
    shareInput.select();
    navigator.clipboard.writeText(shareInput.value);
    updateStatus("Link copied to clipboard! Send it to your friend.");
  }

  function enterChatUI(isHost) {
    document.getElementById("actionButtons").classList.add("hidden");
    document.getElementById("roomName").disabled = true;
    document.getElementById("roomLabel").textContent = `Room: ${roomName}`;
    if (isHost) document.getElementById("copyLinkBtn").classList.remove("hidden");
    document.getElementById("chatUI").classList.remove("hidden");
    startHeartbeatLoop();
  }

  async function hostChat() {
    let baseRoom = document.getElementById("roomName").value.trim() || "super-secret-chat-992";
    roomName = baseRoom.includes("-") ? baseRoom : `${baseRoom}-${getRandomSuffix()}`;
    document.getElementById("roomName").value = roomName;
    role = "host";
    room = namespacedRoom(roomName);

    const url = new URL(window.location.href);
    url.searchParams.set("room", roomName);
    document.getElementById("shareUrl").value = url.toString();
    document.getElementById("shareContainer").classList.remove("hidden");

    try {
      updateStatus("Connecting to signaling server...");
      await connectSignaling();
    } catch (e) {
      updateStatus(e.message);
      return;
    }

    enterChatUI(true);
    enterHostWaitingState("Room is live -- waiting for your friend to join...");
  }

  async function joinChat() {
    roomName = document.getElementById("roomName").value.trim();
    if (!roomName) return alert("Please enter or paste a room name.");
    role = "join";
    room = namespacedRoom(roomName);

    try {
      updateStatus("Connecting to signaling server...");
      await connectSignaling();
    } catch (e) {
      updateStatus(e.message);
      return;
    }

    enterChatUI(false);
    establishJoinConnection();
  }

  function sendMsg() {
    const input = document.getElementById("msgInput");
    const val = input.value.trim();
    if (!val) return;
    const escapedVal = val.replace(/</g, "&lt;").replace(/>/g, "&gt;");

    if (dataChannel && dataChannel.readyState === "open") {
      dataChannel.send(escapedVal);
      addMsg(escapedVal, "me");
    } else if (room && sendSignal({ kind: "chat", text: escapedVal })) {
      addMsg(escapedVal + ' <span class="via-relay">(via relay)</span>', "me");
    } else {
      addMsg("Not connected yet -- message wasn't sent.", "sys");
      return;
    }
    input.value = "";
  }

  // ---------------------------------------------------------------------
  // File transfer (P2P only)
  // ---------------------------------------------------------------------
  const chatUI = document.getElementById("chatUI");

  chatUI.addEventListener("dragover", (e) => {
    e.preventDefault();
    chatUI.classList.add("dragover");
  });

  chatUI.addEventListener("dragleave", (e) => {
    e.preventDefault();
    chatUI.classList.remove("dragover");
  });

  chatUI.addEventListener("drop", (e) => {
    e.preventDefault();
    chatUI.classList.remove("dragover");

    if (e.dataTransfer.files.length > 0) {
      if (dataChannel && dataChannel.readyState === "open") {
        offerFile(e.dataTransfer.files[0]);
      } else {
        alert("You need a direct P2P connection (not just the relay) to send files.");
      }
    }
  });

  function offerFile(file) {
    pendingFile = file;
    const msg = {
      type: "file-offer",
      name: file.name,
      size: file.size
    };
    dataChannel.send(JSON.stringify(msg));
    addMsg(`<em>Offered file: ${file.name} (${formatBytes(file.size)}). Waiting for them to accept...</em>`, "me");
  }

  window.acceptFileTransfer = function() {
    dataChannel.send(JSON.stringify({ type: "file-accept" }));
    addMsg(`<em>Downloading ${incomingFileInfo.name}...</em>`, "me");
  };

  function startFileTransfer() {
    if (!pendingFile) return;

    const CHUNK_SIZE = 16384;
    let offset = 0;

    addMsg(`<em>Uploading ${pendingFile.name}...</em>`, "sys");

    const readSlice = (o) => {
      const slice = pendingFile.slice(offset, o + CHUNK_SIZE);
      const reader = new FileReader();

      reader.onload = (e) => {
        if (dataChannel.readyState !== "open") return;

        dataChannel.send(e.target.result);
        offset += CHUNK_SIZE;

        if (offset < pendingFile.size) {
          setTimeout(() => readSlice(offset), 0);
        } else {
          dataChannel.send(JSON.stringify({ type: "file-done" }));
          addMsg(`<em>Upload complete: ${pendingFile.name}</em>`, "sys");
          pendingFile = null;
        }
      };
      reader.readAsArrayBuffer(slice);
    };

    readSlice(0);
  }

  function finishFileReceive() {
    const blob = new Blob(incomingFileData);
    const url = URL.createObjectURL(blob);

    const fileHtml = `
      <strong>File Received!</strong><br>
      <a href="${url}" download="${incomingFileInfo.name}" style="font-weight: bold; text-decoration: underline; display: inline-block; margin-top: 5px;">
        Save ${incomingFileInfo.name}
      </a>
    `;
    addMsg(fileHtml, "them");
    addMsg(`<em>Download complete: ${incomingFileInfo.name}</em>`, "sys");

    incomingFileInfo = null;
    incomingFileData = [];
  }

  window.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const roomParam = params.get("room");

    if (!getSignalingUrl()) {
      updateStatus('No signaling server set. Add "?signaling=your-ws-host" to this page\'s URL (e.g. ?signaling=ws-verbatim.ur4ulq.workers.dev).');
      return;
    }

    if (roomParam) {
      document.getElementById("roomName").value = roomParam;
      document.getElementById("roomName").disabled = true;
      document.getElementById("hostBtn").classList.add("hidden");

      // A room link always means "join": connect to signaling, show the
      // chat screen (relay fallback active), and negotiate P2P in the
      // background. Works the same on first load and on a page reload --
      // reload just means a brand new join, and the host (if still
      // around) self-heals as soon as it hears from us.
      updateStatus(`Invite link detected for room "${roomParam}". Connecting...`);
      joinChat();
    }
  });
</script>

</body>
</html>
