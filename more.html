const app = {
  controls: {}, 
  lastChange: {},
  queues: {},
  currentState: {},
  ws: null,
  wsConnected: false,
  restTimer: null,
  restDeltaId: null,
  wsDataTimeout: null,
  wsInitTimeout: null,
  wsSilenceTimer: null,
  wsAckWaiters: {}, // stateKey -> callback to run when dataAck:<key> arrives (or when we give up)

  // True until the first successful setConnected(true, ...) - covers the
  // gap between page load and first data, same as any later drop back to
  // "Offline". Feeds the stale-wave overlay alongside isOverdue.
  isOffline: true,

  // True while the tab has been hidden long enough that we deliberately
  // tore down the connection (see pauseForBackground). Distinct from
  // isOffline: this is an intentional rest, not a failure, so it's checked
  // separately to keep the "is-stale" shimmer from firing for it.
  isPaused: false,
  backgroundTimer: null,
  // Set right before we call ws.close() ourselves for a reason other than
  // "the connection actually failed" (right now: only the background
  // pause) - onclose checks this to skip its normal REST-fallback +
  // reconnect behavior, since we don't want either of those while paused.
  suppressReconnectOnClose: false,
  
  stats: {
    rxData: [],
    rxHistory: [], // stores {size, rt}
    windowMs: 3000, // 3 seconds
    wsPendingReqAt: null,
    updaterId: null
  },

  els: {
    dash: document.getElementById('dashboard'),
    toast: document.getElementById('toast-container'),
    dot: document.getElementById('conn-dot'),
    txt: document.getElementById('conn-text'),
    statRx: document.getElementById('stat-rx'),
    statRt: document.getElementById('stat-rt'),
    statSz: document.getElementById('stat-sz'),
    statRssi: document.getElementById('stat-rssi'),
    devBanner: document.getElementById('dev-banner'),
    envTimeText: document.getElementById('env-time-text'),
    envTimeDayNight: document.getElementById('env-time-daynight'),
    badgeCloudFlare: document.getElementById('badge-cf'),
    badgeSinric: document.getElementById('badge-sinric'),
    badgeUkrAlarm: document.getElementById('badge-ukralarm'),
    badgeThingSpeak: document.getElementById('badge-thingspeak'),
    badgeInternet: document.getElementById('badge-internet'),
    warningsBanner: document.getElementById('warnings-banner'),
    miniDash: document.getElementById('mini-dashboard'),
    modeToggleBtn: document.getElementById('mode-toggle-btn')
  },

  // Figures out where to actually talk to the ESP, so the exact same file
  // works whether it's served from the ESP's own LittleFS or just
  // double-clicked open from disk / served by a local dev tool while
  // tweaking CSS/layout:
  //  - Normally (served from the ESP): use the page's own origin, as before.
  //  - Opened as a local file (file://), OR served from a loopback address
  //    (127.0.0.1, localhost, ::1 - e.g. VS Code's Live Server or any other
  //    "open with local server" tool): fall back to CONFIG.ws.devFallbackHost.
  //    The ESP will basically never legitimately be reached at a loopback
  //    address, so this is a safe signal that it's not the real device.
  //  - ?devHost=<ip[:port]> in the URL: explicit override, takes priority
  //    over everything (handy for testing against a different bench ESP
  //    without editing this file at all).
  // Whichever fallback path is taken, isDev is true and a banner is shown -
  // there's no silent/invisible way to end up pointed at the wrong device.
  isLoopbackHost(hostname) {
    return hostname === 'localhost' || hostname === '::1' || /^127\.\d+\.\d+\.\d+$/.test(hostname);
  },

  resolveHost() {
    const params = new URLSearchParams(window.location.search);
    const override = params.get('devHost');
    if (override) return { host: override, isDev: true };

    const isFile = window.location.protocol === 'file:';
    const isLoopback = this.isLoopbackHost(window.location.hostname);
    if (isFile || isLoopback) {
      return { host: CONFIG.ws.devFallbackHost, isDev: true };
    }

    return { host: window.location.hostname || 'localhost', isDev: false };
  },

  // ?cf=<worker-host> switches the page into Cloudflare relay mode: instead
  // of talking to the ESP directly (LAN-only), everything goes through the
  // ws-bridge Durable Object at this host. Takes priority over devHost/
  // loopback detection - it's a completely separate transport, not a variant
  // of "where's the ESP", so it's resolved on its own rather than folded
  // into resolveHost().
  // ex: https://example.com/more.html?cf=xxxx.xxxxxx.workers.dev
  resolveCf() {
    const params = new URLSearchParams(window.location.search);
    return params.get('cf');
  },

  // All connection-related console output goes through this one place, so
  // it's easy to tell at a glance what the connection layer is actually
  // doing right now (waiting on a timeout, switched to REST, reconnecting,
  // paused because the tab's been in the background, etc.) instead of
  // guessing from silence.
  logConn(...args) {
    console.log('%c[conn]', 'color:#08e18e; font-weight:bold', ...args);
  },

  init() {
    const cfHost = this.resolveCf();

    if (cfHost) {
      // CF relay mode: no ESP on the LAN to fall back to REST against, so
      // apiHost/apiBase/isDevMode are irrelevant here - the only transport
      // is the WS connection to the bridge, set up in connectWS().
      this.isCfMode = true;
      this.cfHost = cfHost;
      this.isDevMode = false;
      // No banner here - the "CF WS Mode" connection-status badge (set in
      // connectWS's onopen) already covers it, and stays accurate if the
      // connection ever drops (a static banner wouldn't).
      this.logConn('CF WS mode detected - relaying through', cfHost);
    } else {
      const { host, isDev } = this.resolveHost();
      this.apiHost = host;
      this.isDevMode = isDev;
      // Prefixed onto every relative REST URL (fetchTimeout below) - empty
      // string in normal operation, so this is a complete no-op unless a dev
      // override was actually detected.
      // ex: http://192.168.4.212:5500/more.html?devHost=192.168.4.213
      this.apiBase = isDev ? `http://${host}` : '';

      if (isDev) {
        this.els.devBanner.textContent = `⚠ DEV MODE — connecting to ${host} (opened outside the ESP)`;
        this.els.devBanner.style.display = 'block';
        this.logConn('Dev mode detected - redirecting WS/REST to', host);
      }
    }

    this.renderLayout();
    this.initMiniMode();
    this.connectWS();

    // CF mode has no REST fallback to start (there's no /control_state
    // proxied through the bridge, and the ESP isn't reachable directly from
    // wherever this page is being loaded) - the CF branch of ws.onclose
    // handles its own retry loop instead, so skip this entirely.
    if (!this.isCfMode) {
      // Give WebSocket a 1.5 second head start to connect.
      this.wsInitTimeout = setTimeout(() => {
        if (!this.wsConnected) {
          this.logConn('WS did not connect within 1.5s - starting REST fallback');
          this.startRESTFallback();
        }
      }, 1500);
    }

    // Start stats updater loop
    this.stats.updaterId = setInterval(() => this.updateStatsUI(), 200);

    this.initVisibilityHandling();
    this.initPageLifecycleHandling();
    this.reserveWarningsLine();
  },

  // Reserves one line's worth of height in the warnings banner immediately
  // on load, before we even know whether there's anything real to show -
  // so the page never does that "nothing, then a row suddenly pops in"
  // jump the first time a warning actually fires. This isn't a new code
  // path: it just seeds the exact same hold/collapse state that already
  // governs every other height change (see scheduleWarningsHeight) with a
  // starting height and a "needed at" timestamp, as if a warning had just
  // been showing. If nothing real ever shows up, it holds for the usual
  // warningsHoldMs and then eases down to 0 as any other shrink would -
  // not a special empty-state case.
  reserveWarningsLine() {
    const el = this.els.warningsBanner;
    if (!el) return;

    el.style.display = 'flex';

    // A throwaway pill purely to measure what one real row looks like -
    // never shown as an actual warning, removed immediately after.
    const ref = document.createElement('span');
    ref.className = 'warn-pill ok';
    ref.textContent = 'placeholder';
    ref.style.visibility = 'hidden';
    el.appendChild(ref);

    const oneLineHeight = this.measureWarningsContentHeight(el);
    el.removeChild(ref);

    this.applyWarningsHeight(oneLineHeight);
    this._warningsHeightNeededAt = Date.now();
  },

  // Handles browser back/forward cache (bfcache), which is the actual cause
  // of connectedClients() growing when navigating back and forth between
  // pages on the same origin: bfcache SUSPENDS a page instead of destroying
  // it, so `unload`/`beforeunload` never fire and the WS would otherwise
  // stay open indefinitely in memory - one zombie connection per page you've
  // ever navigated away from. `pagehide` fires in both the real-teardown
  // and the bfcache-suspend case, so closing the socket there covers both.
  //
  // The other half matters just as much: if we only close on pagehide and
  // never reopen anything, then navigating back to a bfcached page (very
  // common with browser back/forward) leaves it permanently disconnected -
  // suppressReconnectOnClose deliberately skips the normal reconnect path,
  // and nothing else would ever call connectWS() again for that instance.
  // `pageshow` with event.persisted === true is exactly the signal that a
  // page was just restored from bfcache (as opposed to a fresh load, where
  // init() already runs connectWS() itself) - so that's this method's other job.
  initPageLifecycleHandling() {
    window.addEventListener('pagehide', () => {
      if (this.ws && (this.ws.readyState === WebSocket.OPEN || this.ws.readyState === WebSocket.CONNECTING)) {
        this.logConn('Page hidden/navigating away - closing WS to avoid a zombie connection on the ESP');
        this.suppressReconnectOnClose = true;
        this.ws.close(1000, 'Page navigated away');
      }
    });

    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        this.logConn('Page restored from bfcache - reconnecting');
        this.connectWS();
        this.wsInitTimeout = setTimeout(() => {
          if (!this.wsConnected) {
            this.logConn('WS did not connect within 1.5s after bfcache restore - starting REST fallback');
            this.startRESTFallback();
          }
        }, 1500);
      }
    });
  },

  // A forgotten background tab shouldn't keep a WS connection (and its
  // getData loop) alive forever, or fall back to REST polling either -
  // both just burn the ESP's resources for a page nobody's looking at.
  // Give it CONFIG.background.suspendAfterMs of grace (covers briefly
  // switching tabs/apps) before tearing the connection down; the instant
  // the tab is visible again, reconnect exactly like a fresh page load.
  initVisibilityHandling() {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        this.logConn(`Tab hidden - will pause connection in ${CONFIG.background.suspendAfterMs / 1000}s if it stays hidden`);
        clearTimeout(this.backgroundTimer);
        this.backgroundTimer = setTimeout(() => this.pauseForBackground(), CONFIG.background.suspendAfterMs);
      } else {
        if (this.backgroundTimer) {
          clearTimeout(this.backgroundTimer);
          this.backgroundTimer = null;
          this.logConn('Tab visible again - still within the grace window, connection was never paused');
        }
        if (this.isPaused) {
          this.resumeFromBackground();
        }
      }
    });
  },

  pauseForBackground() {
    this.backgroundTimer = null;
    this.isPaused = true;
    this.logConn(`Tab hidden for ${CONFIG.background.suspendAfterMs / 1000}s+ - closing WS, pausing all polling (no REST fallback either) until it's visible again`);

    this.stopRESTFallback();
    clearTimeout(this.wsInitTimeout);
    clearTimeout(this.wsDataTimeout);
    clearTimeout(this.wsSilenceTimer);

    if (this.ws) {
      this.suppressReconnectOnClose = true;
      this.ws.close();
    }

    this.setConnected(false, 'Paused (background)');
  },

  resumeFromBackground() {
    this.isPaused = false;
    this.logConn('Tab visible again after being paused - reconnecting WS');
    this.connectWS();

    this.wsInitTimeout = setTimeout(() => {
      if (!this.wsConnected) {
        this.logConn('WS did not connect within 1.5s after resuming - starting REST fallback');
        this.startRESTFallback();
      }
    }, 1500);
  },

  // --- Statistics Logic ---
  recordRx(bytes, rt) {
    const now = performance.now();
    this.stats.rxData.push({ time: now, bytes });
    this.cleanOldStats(this.stats.rxData, now);

    this.stats.rxHistory.push({ size: bytes, rt });
    if(this.stats.rxHistory.length > 10) this.stats.rxHistory.shift();
  },

  cleanOldStats(arr, now) {
    const cutoff = now - this.stats.windowMs;
    while(arr.length > 0 && arr[0].time < cutoff) {
      arr.shift();
    }
  },

  computeSpeed(arr) {
    if (arr.length === 0) return 0;
    const totalBytes = arr.reduce((sum, item) => sum + item.bytes, 0);
    return (totalBytes / (this.stats.windowMs / 1000)) / 1024;
  },

  updateStatsUI() {
    const rxKbps = this.computeSpeed(this.stats.rxData);

    let avgSize = 0, avgRt = 0;
    const hist = this.stats.rxHistory;
    if (hist.length > 0) {
      avgSize = hist.reduce((s, h) => s + h.size, 0) / hist.length;
      const rtHist = hist.filter(h => h.rt !== null);
      if(rtHist.length > 0) {
        avgRt = rtHist.reduce((s, h) => s + h.rt, 0) / rtHist.length;
      }
    }

    this.els.statRx.textContent = rxKbps.toFixed(2);
    this.els.statSz.textContent = Math.round(avgSize);

    // A request is "overdue" if one is currently in flight (wsPendingReqAt
    // set) and has been waiting longer than overdueMultiplier x the recent
    // average - i.e. this specific request, not the connection as a whole,
    // is running unusually slow right now. This is a purely visual signal
    // and resolves itself the instant a response arrives (wsPendingReqAt is
    // cleared in onmessage); it doesn't force a reconnect the way the
    // silenceMs watchdog does - that's still the thing that actually acts
    // if the connection is truly stuck.
    let isOverdue = false;
    if (this.stats.wsPendingReqAt !== null) {
      const waitingFor = performance.now() - this.stats.wsPendingReqAt;
      const threshold = Math.max(avgRt * CONFIG.stats.overdueMultiplier, CONFIG.stats.overdueMinMs);
      isOverdue = waitingFor > threshold;
    }
    this.els.statRt.textContent = Math.round(avgRt);
    this.els.statRt.classList.toggle('is-warn', isOverdue);
    // Same signal, bigger stage: while this request is overdue, OR while
    // we have no connection at all (initial load, or dropped WS/REST both),
    // sweep a shimmer across every card (see .dashboard-grid.is-stale) so
    // the whole dashboard reads as "not showing fresh data right now",
    // not just the one RT number. Suppressed while intentionally paused
    // for backgrounding - that's a deliberate rest, not a failure, so it
    // shouldn't look alarming. Applied to both #dashboard and
    // #mini-dashboard - they're alternate views of the same underlying
    // data (see app.applyMiniMode), so whichever one is actually visible
    // needs the same "this isn't fresh" signal; only one is ever shown at
    // once, but there's no reason to special-case which.
    const isStale = !this.isPaused && (isOverdue || this.isOffline);
    this.els.dash.classList.toggle('is-stale', isStale);
    this.els.miniDash?.classList.toggle('is-stale', isStale);

    // Signal strength, read straight from the last known state snapshot
    // rather than tracked separately - it updates whenever ESP.RSSI shows up
    // in a telemetry push, same cadence as everything else on the dashboard.
    const rssi = this.getByPath(this.currentState, 'ESP.RSSI');
    if (typeof rssi === 'number') {
      this.els.statRssi.textContent = rssi;
      this.els.statRssi.classList.toggle('is-danger', rssi < CONFIG.stats.rssiDangerAt);
      this.els.statRssi.classList.toggle('is-warn', rssi >= CONFIG.stats.rssiDangerAt && rssi < CONFIG.stats.rssiWarnAt);
    } else {
      this.els.statRssi.textContent = '--';
      this.els.statRssi.classList.remove('is-warn', 'is-danger');
    }
  },
  // ------------------------

  deepMerge(target, delta) {
    for (const key of Object.keys(delta)) {
      const val = delta[key];
      if (val !== null && typeof val === 'object' && !Array.isArray(val)) {
        if (typeof target[key] !== 'object' || target[key] === null || Array.isArray(target[key])) {
          target[key] = {};
        }
        this.deepMerge(target[key], val);
      } else {
        target[key] = val;
      }
    }
    return target;
  },

  connectWS() {
    if (this.ws && (this.ws.readyState === WebSocket.CONNECTING || this.ws.readyState === WebSocket.OPEN)) return;

    let wsUrl;
    if (this.isCfMode) {
      // Always wss: - this is a public workers.dev endpoint out on the
      // internet, not a same-LAN ESP, regardless of what protocol this page
      // itself was loaded over.
      wsUrl = `wss://${this.cfHost}/?role=client`;
      // Fresh id every time we (re)connect, same reasoning as restDeltaId in
      // startRESTFallback(): the bridge/ESP has no delta history for a brand
      // new id, so whatever comes back first is guaranteed a full snapshot
      // rather than a delta computed against a baseline we never actually
      // saw.
      this.cfDeltaId = Math.floor(Math.random() * (1000000 - 100 + 1)) + 100;
    } else {
      // wss: only ever makes sense when this page itself was loaded over
      // https - a devHost override is always plain ws:.
      const protocol = (!this.isDevMode && window.location.protocol === 'https:') ? 'wss:' : 'ws:';
      // this.apiHost may already include its own port (e.g. ?devHost=10.0.0.5:9999
      // for a bench setup running WS on a non-default port) - only append the
      // configured CONFIG.ws.port when the host doesn't specify one itself.
      const hostAndPort = this.apiHost.includes(':') ? this.apiHost : `${this.apiHost}:${CONFIG.ws.port}`;
      wsUrl = `${protocol}//${hostAndPort}/`;
    }

    this.logConn('Connecting WS to', wsUrl);
    this.ws = new WebSocket(wsUrl);

    this.ws.onopen = () => {
      this.wsConnected = true;
      this.logConn('WS open' + (this.isCfMode ? ' (via CF bridge)' : ''));
      clearTimeout(this.wsInitTimeout); // Prevent REST from triggering if it hasn't yet
      this.stopRESTFallback();          // Stop REST if it was already running
      this.setConnected(true, this.isCfMode ? 'CF Mode' : 'WS Live');
      this.armWsWatchdog(); // covers the case where the ESP never even sends the first push

      // Direct-connection mode relies on the ESP pushing the first snapshot
      // unprompted the moment it sees a new WS client connect. Over the CF
      // bridge that connect event is invisible to the ESP - the bridge is a
      // dumb relay and the ESP only has the one shared upstream socket - so
      // nothing will ever arrive until we explicitly ask for it ourselves.
      if (this.isCfMode) this.sendGetData();
    };

    this.ws.onmessage = (e) => {
      this.armWsWatchdog(); // got something - push the stall deadline back out

      // Acks for control-set writes are a separate, lightweight message type
      // from telemetry - handle and bail out before any JSON/stat bookkeeping.
      if (typeof e.data === 'string' && e.data.startsWith('dataAck:')) {
        const key = e.data.slice('dataAck:'.length);
        const waiter = this.wsAckWaiters[key];
        if (waiter) waiter();
        return;
      }

      // A reply means our in-flight CF request actually completed the round
      // trip - clear its watchdog so it can't fire underneath a response
      // that's already here and rotate the id for no reason.
      if (this.isCfMode) clearTimeout(this.cfReqTimeout);

      let rt = null;
      if (this.stats.wsPendingReqAt) {
         rt = performance.now() - this.stats.wsPendingReqAt;
         this.stats.wsPendingReqAt = null;
      }
      const size = typeof e.data === 'string' ? textEncoder.encode(e.data).length : (e.data.byteLength || e.data.size || 0);
      this.recordRx(size, rt);

      try {
        const data = JSON.parse(e.data);
        
        // Merge delta or full snapshot into the state
        this.currentState = this.deepMerge(this.currentState, data);
        this.updateUI(this.currentState);

        // Schedule next delta request
        clearTimeout(this.wsDataTimeout);
        this.wsDataTimeout = setTimeout(() => this.sendGetData(), CONFIG.ws.reqDelayMs);

      } catch(err) {
        console.error("WS Parse error", err);
      }
    };

    this.ws.onclose = () => {
      this.wsConnected = false;
      clearTimeout(this.wsSilenceTimer);
      clearTimeout(this.cfReqTimeout);
      // Any control-set writes waiting on a dataAck will never get one now -
      // resolve them so their per-key queues don't get stuck with
      // sending=true forever. flushQueue re-checks wsConnected fresh each
      // time, so the retried send will naturally go out over REST instead
      // (direct mode) - in CF mode there's nowhere else for it to go until
      // reconnected, so it'll just get requeued next time the queue flushes.
      Object.values(this.wsAckWaiters).forEach(waiter => waiter());
      this.wsAckWaiters = {};

      // If we closed this ourselves for the background pause, none of the
      // normal recovery behavior applies - pauseForBackground() already set
      // the "Paused" status, and resumeFromBackground() is what reconnects,
      // not this handler.
      if (this.suppressReconnectOnClose) {
        this.suppressReconnectOnClose = false;
        this.logConn('WS closed intentionally (background pause or page navigation) - not reconnecting or falling back to REST');
        return;
      }

      if (this.isCfMode) {
        // No REST fallback exists in CF mode - the bridge doesn't proxy
        // /control_state and the ESP generally isn't reachable directly from
        // wherever this page is loaded (that's the whole reason to be in CF
        // mode). Just keep retrying the CF connection itself.
        this.logConn(`CF WS closed - retrying in ${CONFIG.ws.reconnectMs / 1000}s`);
        this.setConnected(false, 'Offline');
        setTimeout(() => this.connectWS(), CONFIG.ws.reconnectMs);
        return;
      }

      this.logConn(`WS closed - starting REST fallback, will retry WS in ${CONFIG.ws.reconnectMs / 1000}s`);
      this.setConnected(false, 'Offline');
      this.startRESTFallback();
      setTimeout(() => this.connectWS(), CONFIG.ws.reconnectMs);
    };

    this.ws.onerror = () => {
      this.logConn('WS error - closing (onclose will handle fallback/reconnect)');
      this.ws.close(); // Triggers onclose
    };
  },

  // Single place that actually sends a getData request, so the normal
  // post-message chain (onmessage scheduling the next one) and the CF
  // per-request timeout/retry path both funnel through the same logic
  // instead of duplicating the send + delta-id bookkeeping in two places.
  sendGetData() {
    if (!this.wsConnected || !this.ws || this.ws.readyState !== WebSocket.OPEN) return;

    this.stats.wsPendingReqAt = performance.now();

    if (!this.isCfMode) {
      this.ws.send("getData");
      return;
    }

    this.ws.send(`getData?deltaRandomId=${this.cfDeltaId}`);

    // Mirrors the reasoning in pollStateREST's catch block: if nothing comes
    // back within this window, we genuinely can't tell whether the ESP never
    // saw the request, or saw it, computed a reply, and updated its baseline
    // for this id before the reply got lost on the way back (e.g. the ESP's
    // own socket to the bridge dropped/reconnected mid-flight). Either way
    // our local state can no longer be trusted to match the ESP's baseline
    // for cfDeltaId, so - same as the REST path - burn it and retry with a
    // fresh one rather than risk a silent, compounding desync. A brand new
    // id has no history, so the next reply is guaranteed to be a full
    // snapshot, not a delta computed against something we never received.
    clearTimeout(this.cfReqTimeout);
    this.cfReqTimeout = setTimeout(() => {
      const oldId = this.cfDeltaId;
      this.cfDeltaId = Math.floor(Math.random() * (1000000 - 100 + 1)) + 100;
      this.logConn(`CF getData timed out for deltaRandomId ${oldId} - discarding it, retrying with ${this.cfDeltaId}`);
      this.sendGetData();
    }, CONFIG.ws.cfRequestTimeoutMs);
  },

  // Resets on every message and on connect; if it ever fires, the getData
  // loop has gone silent without a close/error event (e.g. a hung ESP task),
  // so we force the socket closed to trigger the existing, working
  // onclose -> REST fallback + reconnect path rather than inventing new
  // recovery logic.
  armWsWatchdog() {
    clearTimeout(this.wsSilenceTimer);
    this.wsSilenceTimer = setTimeout(() => {
      this.logConn(`WS silent for ${CONFIG.ws.silenceMs / 1000}s - forcing reconnect`);
      if (this.ws) this.ws.close();
    }, CONFIG.ws.silenceMs);
  },

  startRESTFallback() {
    if (!this.restTimer && !this.wsConnected) {
      this.logConn(`Starting REST fallback polling (every ${CONFIG.api.pollInterval}ms)`);
      // Generate a new ID every time we start a new REST fallback session
      this.restDeltaId = Math.floor(Math.random() * (1000000 - 100 + 1)) + 100;
      this.pollStateREST();
      this.restTimer = setInterval(() => this.pollStateREST(), CONFIG.api.pollInterval);
    }
  },

  stopRESTFallback() {
    if (this.restTimer) {
      this.logConn('Stopping REST fallback polling');
      clearInterval(this.restTimer);
      this.restTimer = null;
      this.restDeltaId = null;
    }
  },

  async pollStateREST() {
    if (this.wsConnected) return; // Don't fetch if WS is active
    
    try {
      // Not the actual fix for the desync bug (that's the deltaRandomId
      // rotation in the catch block below) - this is just cheap insurance
      // against any HTTP/proxy/browser cache layer memoizing a GET by URL,
      // so that possibility is fully ruled out rather than just assumed.
      const cacheBuster = Date.now();
      const url = `${CONFIG.api.stateUrl}?deltaRandomId=${this.restDeltaId}&cacheBuster=${cacheBuster}`;
      const res = await this.fetchTracked(url);
      
      if (!res.ok) throw new Error(`status ${res.status}`);
      const data = await res.json();
      
      // CRITICAL CHECK: Did the WebSocket connect while we were waiting for this HTTP response?
      if (this.wsConnected) return; 
      
      this.setConnected(true, 'REST Live', true);
      // Merge delta (or initial snapshot) into the state
      this.currentState = this.deepMerge(this.currentState, data); 
      this.updateUI(this.currentState);
    } catch (e) {
      // Any failure here - an aborted/timed-out fetch, a non-2xx status, or
      // a response that didn't parse as valid JSON - means we can no
      // longer trust that our local state matches what the ESP thinks it
      // just sent us. The ESP updates its per-deltaRandomId baseline the
      // moment it FINISHES COMPUTING a response, not when we confirm
      // receipt - so a client-side abort/timeout says nothing about
      // whether the ESP already committed to "this client now has state
      // S2" while we're still sitting on S1. There's no ack path back to
      // the ESP to undo that, so retrying with the same ID risks every
      // future delta being computed against a baseline we were never
      // actually given - a permanent, compounding desync (this is what was
      // actually happening - not a caching issue).
      //
      // Rather than guessing whether that response was truly lost, burn
      // the ID and pick a fresh one. The ESP has no history for a brand
      // new ID, so the next successful poll is guaranteed to be a full
      // snapshot, not a delta - the only way to actually guarantee resync
      // after an uncertain outcome instead of hoping it wasn't already lost.
      const oldId = this.restDeltaId;
      this.restDeltaId = Math.floor(Math.random() * (1000000 - 100 + 1)) + 100;
      this.logConn(`REST poll failed (${e.message || e}) - discarding deltaRandomId ${oldId}, using ${this.restDeltaId} to force a full resync`);

      if (!this.wsConnected) {
        this.setConnected(false, 'Offline');
      }
    }
  },

  updateUI(state) {
    const now = Date.now();
    for (const [key, renderFns] of Object.entries(this.controls)) {
      const value = this.getByPath(state, key);
      if (value !== undefined && (now - (this.lastChange[key] || 0) > CONFIG.api.suppressMs)) {
        renderFns.forEach(fn => fn(value));
      }
    }

    // Read-only, so no suppression concerns - just redraw from the latest
    // merged state every time, same cadence as the controls above.
    if (this.els.MyTelem) {
      this.els.MyTelem.innerHTML = MyTelem.render(state, false);
    }
    if (this.els.MyTelemMini) {
      this.els.MyTelemMini.innerHTML = MyTelem.render(state, true);
    }

    this.updateEnvTimeIndicator(state);
    this.updateTelemetryBadges(state);
    this.updateWarningsBanner(state);
  },

  // Top warnings banner - one row of pills above the dashboard, built from
  // the same conditions MyTelem.warningsLines() always checked.
  //
  // Two independent animations layer here:
  //  - PER-PILL fade: each warning gets its own DOM element, kept alive
  //    across updates by its stable id (see warningsLines). Only an
  //    actual add/remove of an id fades that pill in/out (~0.3s); a
  //    pill that's still present just gets its text updated in place,
  //    so e.g. a BMS percentage ticking up doesn't re-flash the pill.
  //  - CONTAINER height hold: some warnings blink on for a moment every
  //    few seconds (e.g. "Reading temperature sensors..."). If the banner's
  //    height tracked its content exactly, that blinking - or a pill
  //    wrapping the banner from e.g. 3 rows down to 1 - would keep
  //    reflowing the whole dashboard. So the container's height only ever
  //    GROWS immediately; it only SHRINKS once the smaller size has
  //    actually been sufficient for a full warningsHoldMs. This applies
  //    at every height level, not just "some warnings vs none" - going
  //    from 3 rows to 1 row holds the 3-row height for warningsHoldMs
  //    before easing down to 1 row, exactly like 1 row to fully empty
  //    holds before collapsing to 0 (0 is just the smallest height).
  warningsHoldMs: 12000,
  _warningsHeldHeight: 0,

updateWarningsBanner(state) {
    const el = this.els.warningsBanner;
    if (!el) return;

    const now = state?.ESP?.Time?.Mls ?? 0;
    const list = MyTelem.warningsLines(state, now);

    // 1. HIGH-PERFORMANCE DIRTY CHECK
    let isDirty = !this._lastWarningsList || this._lastWarningsList.length !== list.length;
    if (!isDirty) {
      for (let i = 0; i < list.length; i++) {
        if (list[i].id !== this._lastWarningsList[i].id || list[i].text !== this._lastWarningsList[i].text) {
          isDirty = true;
          break;
        }
      }
    }
    if (!isDirty) return;
    
    // Store shallow copy for next frame
    this._lastWarningsList = [...list];

    this._warningPillEls = this._warningPillEls || new Map();
    const currentIds = new Set(list.map(w => w.id));

    // Helper: Safely measure and schedule height updates
    const triggerMeasure = () => {
      if (!this.els.warningsBanner) return;
      const bannerEl = this.els.warningsBanner;
      const hasContent = bannerEl.querySelector('.warn-pill:not(.leaving)');
      this.scheduleWarningsHeight(hasContent ? this.measureWarningsContentHeight(bannerEl) : 0);
    };

    // 2. LEAVING: Ghost Clone technique
    for (const [id, pillEl] of this._warningPillEls) {
      if (currentIds.has(id)) continue;
      this._warningPillEls.delete(id);

      // Ensure banner acts as coordinate parent for the absolute clone
      if (getComputedStyle(el).position === 'static') {
        el.style.position = 'relative';
      }

      const rect = pillEl.getBoundingClientRect();
      const parentRect = el.getBoundingClientRect();

      // --- 1. SETUP VISUAL CLONE ---
      const clone = pillEl.cloneNode(true);
      clone.style.position = 'absolute';
      clone.style.left = `${rect.left - parentRect.left}px`;
      clone.style.top = `${rect.top - parentRect.top}px`;
      
      // We strip margin so left/top align the box perfectly, but we DO NOT 
      // set inline width/padding so your CSS transitions still work perfectly.
      clone.style.margin = '0'; 
      clone.style.pointerEvents = 'none';
      
      el.appendChild(clone);

      // --- 2. HIDE ORIGINAL ---
      // It stays in normal flow and shrinks (pulling siblings left),
      // but it's invisible so you don't see it teleport to the top row.
      pillEl.style.visibility = 'hidden';

      // --- 3. TRIGGER ANIMATIONS ---
      // Force layout so the clone registers its starting size
      void clone.offsetWidth;

      // Both get the leaving class at the exact same time.
      // Original shrinks flow space. Clone shrinks/fades visually.
      pillEl.classList.add('leaving');
      clone.classList.add('leaving');
      
      let isRemoved = false;
      const remove = (e) => {
        // Wait for the longest layout transition (0.3s) to finish
        if (e && e.propertyName !== 'max-width') return; 
        if (isRemoved) return;
        
        isRemoved = true;
        pillEl.removeEventListener('transitionend', remove); 
        pillEl.remove();
        clone.remove(); // Clean up the visual ghost
        triggerMeasure();
      };
      
      pillEl.addEventListener('transitionend', remove);
      setTimeout(() => remove({ propertyName: 'max-width' }), 400); 
    }

    // 3. ENTERING: DOM pointer logic
    let ref = el.firstElementChild; 
    const newPills = []; 

    list.forEach(w => {
      let pillEl = this._warningPillEls.get(w.id);
      const className = `warn-pill ${w.kind}`;

      if (!pillEl) {
        pillEl = document.createElement('span');
        pillEl.className = className;
        pillEl.textContent = w.text;
        this._warningPillEls.set(w.id, pillEl);
        newPills.push(pillEl);
      } else {
        if (pillEl.textContent !== w.text) pillEl.textContent = w.text;
        if (!pillEl.classList.contains(w.kind)) {
          pillEl.className = `${className}${pillEl.classList.contains('entering') ? ' entering' : ''}`;
        }
      }

      while (ref && ref !== pillEl && ref.classList?.contains('leaving')) {
        ref = ref.nextElementSibling; 
      }

      if (pillEl !== ref) {
        el.insertBefore(pillEl, ref);
      } else {
        ref = ref?.nextElementSibling; 
      }
    });

    if (list.length) {
      el.style.display = 'flex';
      el.style.opacity = '1';
      el.style.marginBottom = '';
    }

    // 4. MEASURE FINAL STATE
    triggerMeasure();

    // 5. ANIMATE NEW ELEMENTS
    if (newPills.length > 0) {
      newPills.forEach(p => p.classList.add('entering'));
      
      void el.offsetWidth; // Layout flush
      
      requestAnimationFrame(() => {
        newPills.forEach(p => p.classList.remove('entering'));
      }); 
    }
  },

  measureWarningsContentHeight(el) {
    const contTop = el.getBoundingClientRect().top;
    let bottom = null;
    el.querySelectorAll('.warn-pill:not(.leaving)').forEach(p => {
      const r = p.getBoundingClientRect();
      if (bottom === null || r.bottom > bottom) bottom = r.bottom;
    });
    return bottom === null ? 0 : Math.ceil(bottom - contTop);
  },

  scheduleWarningsHeight(targetHeight) {
    const heldHeight = this._warningsHeldHeight;

    if (targetHeight >= heldHeight) {
      if (this._warningsShrinkTimer) {
        clearTimeout(this._warningsShrinkTimer);
        this._warningsShrinkTimer = null;
      }
      this.applyWarningsHeight(targetHeight);
      this._warningsHeightNeededAt = Date.now();
      return;
    }

    const elapsed = Date.now() - (this._warningsHeightNeededAt || 0);

    if (elapsed >= this.warningsHoldMs) {
      this.applyWarningsHeight(targetHeight);
      this._warningsHeightNeededAt = Date.now();
      return;
    }

    if (!this._warningsShrinkTimer) {
      this._warningsShrinkTimer = setTimeout(() => {
        this._warningsShrinkTimer = null;
        const el = this.els.warningsBanner;
        const hasContent = el && el.querySelector('.warn-pill:not(.leaving)');
        this.scheduleWarningsHeight(hasContent ? this.measureWarningsContentHeight(el) : 0);
      }, this.warningsHoldMs - elapsed);
    }
  },

  applyWarningsHeight(px) {
    const el = this.els.warningsBanner;
    if (!el) return;

    if (px <= 0 && this._warningsHeldHeight === 0 && el.style.display === 'none') {
      return; 
    }

    this._warningsHeldHeight = px;

    if (px > 0) {
      void el.offsetHeight;
      el.style.height = px + 'px';
      return;
    }

    el.style.height = '0px';
    el.style.marginBottom = '0px';
    el.style.opacity = '0';

    // RACE CONDITION FIX
    const cleanup = (e) => {
      if (e.target === el && e.propertyName === 'height') {
        el.removeEventListener('transitionend', cleanup);
        
        // ABORT if the banner was instructed to open again while we were animating closed (0.6s window)
        if (this._warningsHeldHeight > 0) return; 

        el.style.display = 'none';
        el.innerHTML = '';
        this._warningPillEls?.clear();
      }
    };
    
    el.addEventListener('transitionend', cleanup);
  },


  updateTelemetryBadges(state) {
    if (this.els.badgeClients) {
      const conn = state?.ESP?.Conn;

      if (conn?.WS !== undefined) {
        const wsClients = conn.WS;
        const restClients = conn.RS

        // If both are 0, show the anomaly.
        if (wsClients === 0 && restClients === 0) {
          this.els.badgeClients.textContent = "WS: 0 R: 0";
        } else {
          // Otherwise, only push the ones that are not 0 into an array
          const parts = [];
          if (wsClients !== 0) parts.push(`WS: ${wsClients}`);
          if (restClients !== 0) parts.push(`R: ${restClients}`);

          // Join them with a space
          this.els.badgeClients.textContent = parts.join(" ");
        }
      }
    }

    if (this.els.badgeMs) {
      const ms = state?.ESP?.Time?.Mls;
      if (ms !== undefined) this.els.badgeMs.textContent = `MS: ${ms}`;
    }
  },


  // DAY/NIGHT and the B/S/A/T/I connectivity letters are styled as pills,
  updateEnvTimeIndicator(state) {
    const isDay = state?.envr?.day;
    if (isDay !== undefined && this.els.envTimeDayNight) {
      this.els.envTimeDayNight.textContent = isDay ? 'DAY' : 'NIGHT';
      this.els.envTimeDayNight.classList.toggle('day', isDay);
      this.els.envTimeDayNight.classList.toggle('night', !isDay);
    }

    const now = state?.ESP?.Time?.Now;
    if (now && this.els.envTimeText) {
      this.els.envTimeText.textContent = now.trim();
    }

    const conn = state?.ESP?.Conn;
    if (conn && conn.connToAP) {
      const setBadge = (el, isOk) => {
        if (!el) return;
        el.classList.toggle('status-ok', isOk);
        el.classList.toggle('status-bad', !isOk);
      };
      setBadge(this.els.badgeCloudFlare, !!conn.CF);
      setBadge(this.els.badgeSinric, !!conn.Sinric);
      setBadge(this.els.badgeUkrAlarm, !!conn.ukrAlarm);
      setBadge(this.els.badgeThingSpeak, !conn.thingSpeakErr);
      setBadge(this.els.badgeInternet, !conn.internetDown);
    }
  },

  // Every REST call in the app goes through here, so this is the one place
  // that needs to know about dev-mode redirection - fetchTracked, the REST
  // poll fallback, and every control-set/button endpoint all get it for
  // free without any of those call sites needing to change.
  fetchTimeout(url, ms = CONFIG.api.timeout) {
    const fullUrl = (this.apiBase && url.startsWith('/')) ? this.apiBase + url : url;
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), ms);
    return fetch(fullUrl, { signal: controller.signal }).finally(() => clearTimeout(id));
  },

  // HTTP wrapper that accurately calculates network sizes and logs the timings.
  fetchTracked(url, ms = CONFIG.api.timeout) {
    const start = performance.now();
    
    return this.fetchTimeout(url, ms).then(res => {
       const rt = performance.now() - start;
       // Clone response so downstream can still use .json() cleanly
       res.clone().text().then(text => {
          const rxSize = textEncoder.encode(text).length + 60; // Approximate HTTP Headers overhead
          this.recordRx(rxSize, rt);
       }).catch(() => {
          this.recordRx(60, rt); // Fallback size
       });
       return res;
    });
  },

  getByPath(obj, path) {
    const parts = path.split('.');
    let cur = obj;
    for (const part of parts) {
      if (cur === null || typeof cur !== 'object' || !(part in cur)) return undefined;
      cur = cur[part];
    }
    return cur;
  },

  showError(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = `⚠️ ${msg}`;
    this.els.toast.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 5000);
  },

  setConnected(isConn, text = '', isRest = false) {
    this.isOffline = !isConn;
    this.els.dot.classList.toggle('live', isConn && !isRest);
    this.els.dot.classList.toggle('live-rest', isConn && isRest);
    this.els.txt.textContent = text || (isConn ? 'Live' : 'Offline');
  },

  sendControl(cfg, value) {
    this.lastChange[cfg.stateKey] = Date.now();
    let q = this.queues[cfg.stateKey] || { pending: null, sending: false };
    this.queues[cfg.stateKey] = q;
    q.pending = value;
    if (!q.sending) this.flushQueue(cfg, q);
  },

  flushQueue(cfg, q) {
    if (q.pending === null) return;
    const val = q.pending;
    q.pending = null;
    q.sending = true;

    if (this.wsConnected && this.ws && this.ws.readyState === WebSocket.OPEN) {
      this.sendControlWS(cfg, val, q);
    } else {
      this.sendControlREST(cfg, val, q);
    }
  },

  // Fast path: no "endpoint" concept needed here like the REST routes use -
  // just the stateKey and the new value, so the ESP can look up and apply it
  // directly. Only serialized per-stateKey (via q.sending), so dragging two
  // different sliders at once can have both in flight on the same socket;
  // the dataAck echoes the key back so each queue only unblocks on its own ack.
  sendControlWS(cfg, val, q) {
    const key = cfg.stateKey;
    // Sliders hand us inp.value, which is always a string in the DOM even
    // though it's numeric - send it as a real JSON number instead of a
    // quoted string so ArduinoJson gets a properly-typed value.
    const payloadValue = cfg.type === 'slider' ? Number(val) : val;

    let settled = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      delete this.wsAckWaiters[key];
      this.lastChange[key] = Date.now();
      setTimeout(() => { q.sending = false; this.flushQueue(cfg, q); }, CONFIG.ws.setGapMs);
    };

    const timeoutId = setTimeout(() => {
      this.showError(`${cfg.desc} did not acknowledge in time`);
      finish();
    }, CONFIG.ws.setAckTimeoutMs);

    this.wsAckWaiters[key] = finish;

    try {
      this.ws.send(JSON.stringify({ key, value: payloadValue }));
    } catch (err) {
      this.showError(`Failed to send ${cfg.desc} over WS`);
      finish();
    }
  },

  // Unchanged REST fallback path - used whenever WS isn't connected.
  sendControlREST(cfg, val, q) {
    this.fetchTracked(`/${cfg.endpoint}?set=${val}`)
      .then(res => {
        if (!res.ok) this.showError(`${cfg.desc} responded with ${res.status}`);
      })
      .catch(() => this.showError(`Failed to set ${cfg.desc}`))
      .finally(() => {
        this.lastChange[cfg.stateKey] = Date.now();
        setTimeout(() => { q.sending = false; this.flushQueue(cfg, q); }, CONFIG.api.setGapMs);
      });
  },

  // Momentary triggers (IR blasts, etc.) have no stateKey to persist, so
  // they're keyed by the endpoint string itself instead - unique per button
  // by definition, same as the REST route it would otherwise hit. The ESP
  // has no way to report whether the action actually did anything (an IR
  // blast could still miss the receiver); the ack only confirms the command
  // was received, which is all that's meaningfully checkable from here.
  sendStatelessWS(cfg, onDone) {
    const key = cfg.endpoint;
    let settled = false;

    const finish = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      delete this.wsAckWaiters[key];
      onDone();
    };

    const timeoutId = setTimeout(() => {
      this.showError(`${cfg.desc} did not acknowledge in time`);
      finish();
    }, CONFIG.ws.setAckTimeoutMs);

    this.wsAckWaiters[key] = finish;

    try {
      this.ws.send(JSON.stringify({ stateless: key }));
    } catch (err) {
      this.showError(`Failed to send ${cfg.desc} over WS`);
      finish();
    }
  },

  renderLayout() {
    CONFIG.widgets.forEach((w, i) => {
      const card = document.createElement('article');
      card.className = 'card';
      // Staggers the stale-wave sweep (see .dashboard-grid.is-stale in CSS)
      // so it visibly rolls across cards left-to-right/top-to-bottom
      // instead of every card flashing in lockstep.
      card.style.setProperty('--wave-delay', `${(i % 6) * 0.12}s`);
      card.innerHTML = `
        <div class="card-header">
          <span class="icon">${w.icon}</span>
          <h2>${w.title}</h2>
          ${w.type === 'new-telemetry' ? `
          <div class="telemetry-badges">
            <span class="pill ws" id="badge-clients" title="Clients connected">WS: --</span>
            <span class="pill ms" id="badge-ms" title="ESP uptime (ms)">MS: --</span>
          </div>` : ''}
        </div>
        <div class="card-content" id="content-${w.id}"></div>
      `;
      this.els.dash.appendChild(card);
      
      const container = document.getElementById(`content-${w.id}`);
      if (w.type === 'controls') w.items.forEach(c => this.buildControl(c, container));
      if (w.type === 'links') this.buildLinks(w.items, container);
      if (w.type === 'table') this.buildTable(w.items, container);
      if (w.type === 'new-telemetry') {
        container.classList.add('telemetry-new');
        this.els.MyTelem = container;
        this.els.badgeClients = document.getElementById('badge-clients');
        this.els.badgeMs = document.getElementById('badge-ms');
      }
    });
  },

  // Builds the mobile-only mini view: whichever widgets/items opt in via
  // a numeric miniMode, with none of their card titles, all merged into
  // ONE real .card/.card-content element - same classes as the full
  // dashboard's cards (see renderLayout), so mini mode gets the exact
  // same background/border/shadow/padding/stale-wave treatment for free
  // rather than parallel styling that has to be kept in sync by hand.
  // The number is the display ORDER (lower first), not just an on/off
  // flag, and it's compared across widgets and items together - a
  // widget's own miniMode (e.g. telemetry) and its items' miniMode (e.g.
  // two of the lighting sliders) all sort into one single sequence, so
  // e.g. lights can come before telemetry regardless of which order
  // they're declared in CONFIG.widgets - they just render one after
  // another inside the same card-content, in that order.
  // Called once at startup, only when initMiniMode() has already
  // confirmed we're on mobile - this never runs (and .mini-dashboard
  // never gets any content) on desktop.
  renderMiniLayout() {
    const container = this.els.miniDash;
    if (!container) return;

    const entries = [];
    CONFIG.widgets.forEach(w => {
      if (w.type === 'controls' && Array.isArray(w.items)) {
        w.items.forEach(c => {
          if (c.miniMode !== undefined) entries.push({ order: c.miniMode, kind: 'item', cfg: c });
        });
      } else if (w.miniMode !== undefined) {
        entries.push({ order: w.miniMode, kind: 'widget', widget: w });
      }
    });
    entries.sort((a, b) => a.order - b.order);
    if (!entries.length) return;

    const card = document.createElement('article');
    card.className = 'card';
    const content = document.createElement('div');
    content.className = 'card-content';
    card.appendChild(content);
    container.appendChild(card);

    entries.forEach(e => {
      if (e.kind === 'item') {
        this.buildControl(e.cfg, content);
        return;
      }

      if (e.widget.type === 'new-telemetry') {
        const telemetry = document.createElement('div');
        telemetry.className = 'telemetry-new';
        content.appendChild(telemetry);
        this.els.MyTelemMini = telemetry;
      }
    });
  },

  // Mini mode only exists on mobile at all - on desktop .mini-dashboard/
  // the FULL/MINI button stay permanently hidden via CSS regardless of
  // anything below. The tricky part: "mobile" isn't just a load-time
  // fact - resizing an already-open desktop window down past 768px (or
  // rotating a tablet) needs to behave identically to having loaded at
  // that width in the first place, not just make the button visible
  // without anything behind it actually working. So this tracks the
  // breakpoint live via matchMedia's change event, and lazily builds/
  // activates mini mode (renderMiniLayout + default-to-mini +
  // remembered choice) the FIRST time mobile width is ever seen,
  // whether that's immediately or after a later resize. The click
  // handler itself is always attached up front, independent of
  // viewport, and self-activates mini mode if it somehow fires before
  // that's happened yet.
  initMiniMode() {
    const mql = window.matchMedia('(max-width: 768px)');
    this._miniModeActivated = false;

    const activateIfMobile = () => {
      if (!mql.matches || this._miniModeActivated) return;
      this._miniModeActivated = true;

      this.renderMiniLayout();

      let stored = null;
      try { stored = localStorage.getItem('miniMode'); } catch (e) {}
      this.miniMode = stored !== null ? stored === 'true' : true;
      this.applyMiniMode();
    };

    activateIfMobile();
    mql.addEventListener('change', activateIfMobile);

    this.els.modeToggleBtn?.addEventListener('click', () => {
      activateIfMobile();
      this.miniMode = !this.miniMode;
      try { localStorage.setItem('miniMode', this.miniMode); } catch (e) {}
      this.applyMiniMode();
    });
  },

  applyMiniMode() {
    document.body.classList.toggle('mini-active', this.miniMode);
    if (this.els.modeToggleBtn) this.els.modeToggleBtn.textContent = this.miniMode ? 'GO FULL' : 'GO MINI';
  },

  // Registers a render callback for a state key. Most keys only ever have
  // one on-screen control, but mini mode can put a SECOND instance of the
  // same control (e.g. the mainLight slider) on screen at once - so this
  // is a list, not a single slot, and every registered callback for a key
  // gets called on update. See updateUI's loop below.
  registerControl(key, fn) {
    (this.controls[key] ||= []).push(fn);
  },

  // Builds just the interactive part of a control (slider/toggle/choice/
  // color/button) - the bit that lives in .control-action - and wires up
  // its own sendControl/registerControl using cfg's own stateKey/endpoint.
  // Doesn't touch row/info/icon at all, so it can be used both for a
  // control's own row AND for a secondary "extra" control sharing someone
  // else's row (e.g. mainRGB riding along on the mainLight slider's row).
  // onValue is an optional callback for the slider case (label text sync);
  // passed as a parameter rather than stashed on cfg because the same cfg
  // object can be rendered twice (full layout + mini layout both read from
  // the same CONFIG entry), so mutating cfg itself would let the second
  // render's callback silently clobber the first's.
  buildActionNode(cfg, onValue) {
    if (cfg.type === 'slider') {
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = cfg.min; inp.max = cfg.max; inp.step = cfg.step || 1;

      inp.oninput = () => {
        if (onValue) onValue(inp.value);
        this.sendControl(cfg, inp.value);
      };

      this.registerControl(cfg.stateKey, (val) => {
        inp.value = val;
        if (onValue) onValue(val);
      });

      return inp;
    }

    if (cfg.type === 'toggle') {
      const sw = document.createElement('div');
      sw.className = 'switch';
      let current = false;

      sw.onclick = () => {
        current = !current;
        sw.classList.toggle('is-on', current);
        this.sendControl(cfg, current ? true : false);
      };

      this.registerControl(cfg.stateKey, (val) => {
        current = !!val;
        sw.classList.toggle('is-on', current);
      });
      return sw;
    }

    if (cfg.type === 'choice') {
      const seg = document.createElement('div');
      seg.className = 'segmented';
      const btns = cfg.options.map(o => {
        const b = document.createElement('button');
        b.textContent = o.l;
        b.onclick = () => {
          btns.forEach(item => item.el.classList.remove('is-active'));
          b.classList.add('is-active');
          this.sendControl(cfg, o.v);
        };
        seg.appendChild(b);
        return { val: o.v, el: b };
      });

      this.registerControl(cfg.stateKey, (val) => {
        btns.forEach(item => item.el.classList.toggle('is-active', item.val === val));
      });
      return seg;
    }

    if (cfg.type === 'color') {
      const wrapper = document.createElement('div');
      wrapper.className = 'color-container';
      wrapper.style.position = 'relative';

      const swatch = document.createElement('div');
      swatch.className = 'color-swatch';

      const label = document.createElement('div');
      label.className = 'hex-display';
      label.textContent = '#FFFFFF';

      const inp = document.createElement('input');
      inp.type = 'color';
      inp.className = 'hidden-picker';

      inp.oninput = (e) => {
        const hex = e.target.value.toUpperCase();
        label.textContent = hex;
        swatch.style.backgroundColor = hex;
        this.sendControl(cfg, hex.substring(1));
      };

      this.registerControl(cfg.stateKey, (val) => {
        const hex = val.startsWith('#') ? val : '#' + val;
        inp.value = hex;
        label.textContent = hex;
        swatch.style.backgroundColor = hex;
      });

      wrapper.appendChild(swatch);
      wrapper.appendChild(label);
      wrapper.appendChild(inp);
      return wrapper;
    }

    if (cfg.type === 'button') {
      const btn = document.createElement('button');
      btn.className = 'btn secondary';
      btn.textContent = cfg.buttonText || 'Trigger';

      btn.onclick = () => {
        if (btn.disabled) return; // already in flight - ignore extra clicks so we never orphan a pending ack waiter
        btn.disabled = true;
        btn.style.opacity = '0.5';
        const restore = () => { btn.style.opacity = '1'; btn.disabled = false; };

        if (this.wsConnected && this.ws && this.ws.readyState === WebSocket.OPEN) {
          this.sendStatelessWS(cfg, restore);
        } else {
          this.fetchTracked(`/${cfg.endpoint}`)
            .then(res => {
              if (!res.ok) this.showError(`${cfg.desc} responded with ${res.status}`);
            })
            .catch(() => this.showError(`Failed to trigger ${cfg.desc}`))
            .finally(restore);
        }
      };
      return btn;
    }

    return null;
  },

  // cfg.extra (optional array of control configs) rides along in the same
  // row as cfg's own control instead of getting its own icon/desc row -
  // e.g. mainRGB color picker sharing mainLight's slider row, or the LG TV
  // brightness "Step" button sharing the TV power toggle's row. Each extra
  // control still has its own stateKey/endpoint and is fully independent
  // for sendControl/registerControl purposes; this only affects layout.
  buildControl(cfg, container) {
    const row = document.createElement('div');
    row.className = 'control-row';

    const info = document.createElement('div');
    info.className = 'control-info';
    info.innerHTML = `<div class="control-icon">${cfg.icon}</div><div class="control-label">${cfg.desc}</div>`;

    const extras = cfg.extra || [];

    if (cfg.type === 'slider') {
      row.classList.add('is-slider');

      const lbl = document.createElement('div');
      lbl.className = 'slider-val';

      const headerLine = document.createElement('div');
      headerLine.className = 'control-header-line';
      headerLine.appendChild(info);
      extras.forEach(x => headerLine.appendChild(this.buildActionNode(x)));
      headerLine.appendChild(lbl);
      row.appendChild(headerLine);

      const action = document.createElement('div');
      action.className = 'control-action';
      action.appendChild(this.buildActionNode(cfg, (val) => {
        lbl.textContent = `${val}${cfg.unit || ''}`;
      }));
      row.appendChild(action);
      container.appendChild(row);
      return;
    }

    row.appendChild(info);

    const action = document.createElement('div');
    action.className = 'control-action';
    const mainNode = this.buildActionNode(cfg);
    const extraNodes = extras.map(x => this.buildActionNode(x));
    if (cfg.extraPosition === 'before') {
      extraNodes.forEach(n => action.appendChild(n));
      action.appendChild(mainNode);
    } else {
      action.appendChild(mainNode);
      extraNodes.forEach(n => action.appendChild(n));
    }
    row.appendChild(action);
    container.appendChild(row);
  },

  buildLinks(items, container) {
    const list = document.createElement('div');
    list.className = 'link-list';
    
    items.forEach(itm => {
      const a = document.createElement('a');
      a.className = 'link-item';
      if (itm.url) a.href = itm.url.startsWith('http') ? itm.url : `/${itm.url}`;
      
      a.innerHTML = `<span class="icon">${itm.icon}</span><span class="desc">${itm.desc}</span>`;
      
      if (itm.action === 'restart') {
        a.href = '#';
        a.onclick = (e) => { e.preventDefault(); this.showRestartModal(); };
      }
      list.appendChild(a);
    });
    container.appendChild(list);
  },

  buildTable(items, container) {
    items.forEach(itm => {
      const row = document.createElement('a');
      row.className = 'table-row';
      const isAbsolute = itm.url.startsWith('http');
      const href = isAbsolute ? itm.url : `/${itm.url}`;
      row.href = href;
      row.innerHTML = `<div class="table-addr">${href}</div><div class="table-desc">${itm.desc}</div>`;
      container.appendChild(row);
    });
  },

  showRestartModal() {
    const waitSeconds = CONFIG.restartWaitSeconds;
    const m = document.createElement('div');
    m.className = 'modal-overlay';
    m.innerHTML = `
      <div class="modal-box">
        <h3>System Reboot</h3>
        <p>The ESP will disconnect and be unreachable for about 10 seconds.</p>
        <div class="progress-bg" id="rb-bg"><div class="progress-bar" id="rb-bar"></div></div>
        <p id="rb-text" style="display:none"></p>
        <div class="modal-actions" id="rb-actions">
          <button class="btn secondary" id="rb-cancel">Cancel</button>
          <button class="btn primary" id="rb-confirm">Reboot</button>
        </div>
      </div>
    `;
    document.body.appendChild(m);
    
    m.querySelector('#rb-cancel').onclick = () => m.remove();
    m.querySelector('#rb-confirm').onclick = () => {
      fetch(`${this.apiBase}/restart`).catch(()=>{});
      
      m.querySelector('#rb-actions').style.display = 'none';
      m.querySelector('#rb-bg').style.display = 'block';
      const txt = m.querySelector('#rb-text');
      txt.style.display = 'block';
      
      const bar = m.querySelector('#rb-bar');
      setTimeout(() => { bar.style.transition = `width ${waitSeconds}s linear`; bar.style.width = '100%'; }, 50);
      
      let sec = waitSeconds;
      txt.textContent = `Reconnecting in ${sec}s`;
      const timer = setInterval(() => {
        sec--;
        txt.textContent = `Reconnecting in ${sec}s`;
        if (sec <= 0) { clearInterval(timer); window.location.href = '/'; }
      }, 1000);
    };
  }
};

document.addEventListener('DOMContentLoaded', () => app.init());
</script>
